# Règles semgrep MAISON (QA-T07). Les règles publiques ne sont PAS recopiées ici : elles sont
# chargées du registre à l'exécution par `scripts/gates/semgrep.ts` (jeux `p/typescript`,
# `p/nodejs`). Chaque règle de ce fichier a SON témoin dans `TEMOINS` de l'exécuteur : une règle
# sans témoin fait rougir `pnpm sec:semgrep` et `pnpm sec:semgrep:prove` en étant nommée.
#
# Les `paths.include` sont ANCRÉS (`/src/...`) à la racine de projet : l'exécuteur monte `src/`
# sous `/depot` et vise `.`, jamais `src` (sans quoi l'ancre ne matche plus rien).
#
# ── POURQUOI DES MOTIFS AST, ET PLUS UNE EXPRESSION RÉGULIÈRE SUR LE TEXTE ───────────────────
#
# La première écriture de ces deux règles lisait le TEXTE. Elle connaissait des ORTHOGRAPHES —
# `Prisma.raw` pointé, un spécifieur sans extension, `$queryRawUnsafe` écrit en toutes lettres —
# et pas des COMPORTEMENTS. Six fichiers fautifs plantés sous `src/` sont passés en exit 0 et
# 0 constat (revue `securite` du 2026-09-19 sur la PR 82). Les motifs sont donc structurels :
# semgrep résout les alias d'import vers leur nom QUALIFIÉ (mesuré : `import { Prisma as P }`
# puis `P.raw` est matché par `$C.Prisma.raw`), ce qu'aucune regex ne peut faire. Ce qu'une
# regex apportait encore — la lecture du spécifieur de module — est réduit à UNE ancre,
# `&specifieur-du-client`, définie une fois et réutilisée par `*specifieur-du-client`.
#
# ── CE QUE LA RÉSOLUTION NE SUIT PAS, ET CE QUI EN TIENT LIEU (revues `exactitude` et
#    `securite`, PR 82) ──────────────────────────────────────────────────────────────────────
#
# La résolution s'arrête dès que le namespace QUITTE sa liaison d'import : `Prisma?.raw`,
# `Prisma!.raw`, `let P; P = Prisma`, `(x, P = Prisma) =>`, `{ P: Prisma }`, `Prisma satisfies
# …` — tous passaient en exit 0 (mesuré sur 1.176.1). Et elle ne voit pas l'accès CALCULÉ :
# `C['Prisma'].raw` depuis l'objet module passait aussi. Courir après chaque écriture referait
# l'erreur des orthographes — et c'est ce qu'ont montré huit tours de revue : un refus de sortie
# qui admettait « un membre immédiat ou une déstructuration directe » laissait passer le
# namespace lié par déstructuration puis `Sql` atteint autrement que par `.raw` pointé, et la
# clause d'héritage (revue `securite` 5329828516, PR 82). La règle n° 2 est donc une LISTE
# BLANCHE : comme VALEUR, le nom `Prisma` n'a droit qu'à `Prisma.sql`, `Prisma.join`,
# `Prisma.empty` et `Prisma.PrismaClientKnownRequestError`, écrits en clair ; toute autre
# apparition de la valeur est refusée, et les positions de TYPE restent libres. S'y ajoutent le
# NOM `Prisma` écrit comme chaîne, où qu'il soit : c'est ce qui ferme l'accès calculé sur
# l'objet module, quel que soit le chargeur. Les fonctions d'ÉTIQUETTE (`$queryRaw`, `$executeRaw`, `Prisma.sql`)
# n'ont droit, elles, qu'à la position d'étiquette d'un gabarit. Ce que ces motifs ne
# tiennent PAS est nommé plus bas, règle par règle, sous « LIMITES DÉCLARÉES » : la phrase
# ci-dessus n'en promet pas davantage.
#
# ── LE TEXTE N'EST PAS LA VALEUR : L'ÉCHAPPEMENT (revue `exactitude` 5328459424, PR 82) ─────
#
# Motifs et expressions régulières comparent le TEXTE source d'un nom, jamais sa VALEUR. Un nom
# écrit par séquence d'échappement, sans rien de calculé — `u` suivi de quatre chiffres ou
# `u{…}` dans un identifiant ou une chaîne, `x` suivi de deux chiffres, échappement d'identité
# (antislash devant une lettre sans rôle, devant `$` ou `/`), continuation de ligne, octal
# hérité du JavaScript non strict — garde le comportement et passait les deux règles en exit 0,
# membre pointé, accès calculé et spécifieur compris. Plutôt que de décoder, les deux règles
# refusent l'ÉCRITURE elle-même, par un bras textuel commun (`&echappement`, défini dans la
# règle n° 1, réutilisé par la n° 2 : l'espace est nommé par la n° 1, tout `src/` par la n° 2) :
#   — tout échappement `u`, `u{…}` ou `x` d'un caractère IMPRIMABLE. Les caractères de contrôle
#     (U+0000 à U+001F) et DEL (U+007F) restent admis : un caractère de contrôle n'écrit ni un
#     nom de membre ni un spécifieur, et `src/` en porte (le séparateur U+001F des condensats
#     HMAC) ;
#   — tout antislash non échappé suivi d'autre chose que l'antislash, `'`, `"`, l'accent grave,
#     `n`, `r`, `t`, `b`, `f`, `v`, `0` (`u` et `x` sont jugés au tiret précédent) : échappement
#     d'identité — barre oblique et dollar compris —, continuation de ligne, et `0` suivi d'un
#     chiffre (octal).
# EXEMPTIONS DÉCLARÉES, et elles seules : le CORPS d'une expression régulière littérale (`/…/` :
# ses antislashs sont de la syntaxe d'expression, et sa valeur n'est jamais un nom), et le TEXTE
# d'un gabarit `String.raw` SANS interpolation (sa valeur garde l'antislash, c'est du texte).
# Les COMMENTAIRES ne sont pas exemptés.
# L'INTERPOLATION BRUTE, refusée comme CLASSE (revue `exactitude` 5328789820, PR 82) : un
# `String.raw` rend ses interpolations déjà évaluées, donc un littéral de chaîne écrit par
# échappement y arrive DÉCODÉ — `${'…'}` entre guillemets simples ou doubles, parenthésé ou non,
# passait les deux règles en exit 0. Plutôt que de rejuger chaque interpolation, les deux règles
# refusent sous leur périmètre TOUT gabarit `String.raw` qui interpole (`${…}`), quel qu'en soit
# le contenu (bras `&interpolation-brute`, défini dans la règle n° 1, réutilisé par la n° 2) :
# le gabarit est pris par le motif MÊME de l'exemption, et l'interpolation par son ouverture
# `${` non échappée dans le texte de ce gabarit — parce que semgrep replie une interpolation
# littérale dans le texte et qu'aucun motif AST ne la voit plus (mesuré). Tout gabarit exempté
# qui interpole est donc refusé. Les quatre `String.raw` de `src/` (`src/config/entite.ts`) n'interpolent
# pas.
# LIMITE DÉCLARÉE : l'exemption `String.raw` se fie au NOM `String` ; un `String` redéfini
# localement dont `raw` rendrait le texte cuit verrait les échappements de son texte admis.
# Prix ASSUMÉ, sous `src/` : un échappement refusé écrit dans un COMMENTAIRE, un dollar échappé
# dans un gabarit (écrire le dollar hors de la séquence), une barre oblique échappée hors d'une
# expression régulière littérale, et TOUT `String.raw` qui interpole — même une variable sans
# échappement — sont refusés aussi. Aucun fichier de `src/` ne les écrit.
#
# DEUX NOMS ET UNE LIAISON, refusés comme CLASSES par leur TEXTE (revue `exactitude` 5328984956,
# PR 82) : la déstructuration renommée hors d'une déclaration de variable (paramètre, affectation,
# `for … of`, imbriquée) et la liaison `import P = Prisma` passaient la règle n° 2 en exit 0.
# Plutôt qu'un motif AST de plus par écriture, la règle n° 2 refuse sous `src/` :
#   — les identifiants `$queryRawUnsafe` et `$executeRawUnsafe` écrits EN CLAIR, où qu'ils soient
#     (membre, clé de déstructuration ou d'objet, paramètre, chaîne, commentaire). Ici le texte
#     EST la classe et non une orthographe : aucun usage légitime n'existe, leur écriture par
#     échappement est refusée par `&echappement`, et leur nom replié d'une concaténation par le
#     motif de chaîne ;
#   — toute déclaration TypeScript IMPORT-EQUALS (`import X = …`, `export import X = …`), quelle
#     qu'en soit la cible : c'est une liaison que la liste blanche du namespace ne suit pas.
# Prix ASSUMÉ : un commentaire ou une chaîne qui écrit l'un de ces deux noms, ou le texte
# `import X =`, est refusé aussi. Aucun fichier de `src/` ne les écrit.
#
# LE TEXTE N'EST PAS ASCII (revue `securite` 5329281085, PR 82) : TypeScript admet un
# identifiant Unicode (`Pé`, un alias cyrillique) et tout BLANC Unicode entre deux jetons
# (U+0085, U+00A0, U+1680, U+2000 à U+200B, U+2028, U+2029, U+202F, U+205F, U+3000, U+FEFF —
# U+0085 et U+200B sont des blancs pour le scanner de TypeScript sans être `\p{Zs}` ; U+0085
# n'est pas pris pour un blanc par l'analyseur de semgrep 1.176.1, qui rend alors une erreur de
# syntaxe partielle que la gate juge `erreur_semgrep` : il est dans la classe pour ne pas
# dépendre de cette erreur, et n'a pas de témoin au bac, faute d'un fichier analysable). Un bras
# qui lisait un nom par `[A-Za-z_$][\w$]*` et les blancs par `\s` (ASCII sans `(*UCP)`, mesuré
# sur 1.176.1) laissait passer l'import-equals et les formes textuelles de la limite (c) de la
# règle n° 1, commentaire entre les mots compris pour ces dernières. Les bras textuels qui
# lisent une LIAISON (l'import-equals, des deux règles) ou un NOM (la clé `Prisma:` et la clause
# d'héritage de la règle n° 2) ne dépendent donc plus de la forme d'un identifiant :
#   — un mot-clé (`import`, `require`) ou le nom `Prisma` est borné des deux côtés par un
#     caractère qui ne continue pas un identifiant, Unicode compris (`\p{ID_Continue}`, `$`,
#     U+200C, U+200D — PCRE2 de semgrep 1.176.1, mesuré) ; il n'est pas non plus précédé d'un
#     `#` (nom privé), ni, hors de la clause d'héritage, d'un point (membre) ;
#   — un BLANC est tout blanc Unicode ci-dessus ou un commentaire ;
#   — AUCUN bras ne lit plus une LISTE entre accolades (9e tour, revue `exactitude` 5329829625,
#     PR 82 : la lecture « jusqu'à la vraie accolade » consommait une chaîne sans tenir compte de
#     l'antislash, et un guillemet échappé la décalait). La limite (c) de la règle n° 1 est
#     refusée par le TEXTE du fichier entier, voir la règle ;
#   — le nom lié de l'import-equals est TOUT ce qui n'est ni un blanc, ni une ponctuation ASCII
#     (accolade, étoile, guillemet, parenthèse, crochet, point, virgule, deux-points, `=`,
#     opérateur, barre oblique), jusqu'au premier `=` qui n'est ni `==` ni `=>`. Une liaison ES
#     s'arrête toujours avant (accolades, étoile, ou spécifieur entre guillemets), `import()`
#     et `import.meta` aussi ; le MOT `from` ne l'arrête PAS, parce que `import from = X` est un
#     import-equals (`from` est un identifiant contextuel).
# ASYMÉTRIE VOULUE : les deux bras qui lisent les noms `…Unsafe` (règle n° 2) gardent leurs
# bornes ASCII `[\w$]`, et ce sont les SEULES bornes ASCII des bras textuels. Une borne dit où le
# nom NE PEUT PAS être collé ; une borne ASCII en exclut moins qu'une borne Unicode, donc elle ne
# peut que refuser PLUS : `é$queryRawUnsafe` ou `$queryRawUnsafeé` (d'autres identifiants) sont
# refusés aussi, jamais le nom lui-même laissé passer. Et aucun autre texte n'écrit ce nom : un
# identifiant JavaScript n'est pas normalisé, et son écriture par échappement relève de
# `&echappement`. Les mots-clés d'une liaison, eux, sont bornés en Unicode pour ne pas prendre
# un identifiant voisin (`exportÉ`) pour le mot-clé : une borne ASCII y refuserait à tort du code
# légitime. L'asymétrie tient au COÛT d'un faux positif, jamais à ce qui passe.
# Prix ASSUMÉ, élargi : un commentaire ou une chaîne sous `src/` qui écrit `import` puis du texte
# sans ponctuation jusqu'à un `=` est refusé aussi. Aucun fichier de `src/` ne l'écrit.
#
# CE QUE LA GATE FERME, ET CE QU'ELLE N'EST PAS. Deux refus STRICTS, qui promettent moins que
# les tours précédents et tiennent ce qu'ils promettent (9e tour, PR 82) :
#   — règle n° 1 : sous l'espace, tout fichier dont le TEXTE cite le client (`@prisma/`,
#     `.prisma/`, ou une chaîne dont un segment est `prisma` ou `db`) est refusé, où que soit la
#     citation — liaison, directive de types, commentaire, chaîne. Les motifs AST de liaison et
#     de chargeur restent en plus (le chargeur hors de l'appel direct n'a pas de texte à citer) ;
#   — règle n° 2 : le nom `Prisma` comme VALEUR n'a droit qu'aux quatre formes de la LISTE
#     BLANCHE, écrites en clair ; toute autre apparition de la valeur — membre hors liste,
#     membre calculé, déstructuration de `Prisma` ou liaison du namespace par déstructuration,
#     renommage à l'import ou au ré-export, clé `Prisma:`, clause d'héritage, alias, argument,
#     valeur rendue, ré-export — est refusée. Les positions de TYPE restent libres.
# Elle refuse en plus, comme CLASSES, les ÉCHAPPEMENTS (bras `&echappement`), les
# INTERPOLATIONS BRUTES (bras `&interpolation-brute`), les noms `$queryRawUnsafe` et
# `$executeRawUnsafe` écrits en clair où qu'ils soient, toute liaison IMPORT-EQUALS (`import x =
# require(…)` compris), le nom `Prisma` ou `constructor` écrit comme chaîne, les fonctions
# d'étiquette hors étiquette, `Prisma.join` à plus d'une valeur, et les membres dangereux du
# runtime par l'objet module.
# L'ALIAS DU NAMESPACE transmis hors de sa liaison — paramètre, objet, variable, valeur rendue,
# ré-export depuis `src/` — est FERMÉ par la liste blanche : c'est une apparition de la valeur
# hors liste. Reste OUVERT un module HORS de `src/` qui ré-exporte le namespace ou ses membres
# sous un autre nom (limite c de la règle n° 2), et l'objet module d'un spécifieur du client
# qui quitte sa liaison, non suivi pour les membres du RUNTIME (limite d de la règle n° 2).
# LIMITE DÉCLARÉE, à côté des limites de chaque règle : la gate N'EST PAS une barrière contre
# une obfuscation DÉLIBÉRÉE au-delà de ces formes et de ces classes — nom construit à
# l'exécution (`String.fromCharCode`, `atob`, `split('').reverse().join('')`, tableau indexé),
# `eval` ou `Function`, etc. Ces cas relèvent de la relecture humaine de la PR et de la couche
# d'accès cloisonnée, pas de cette gate.
rules:
  # REQ-SEC-008 (texte en vigueur ; REQ-QA-011 y est absorbée) : aucun import direct du client de
  # base sous l'espace apporteur. `import type` compris — l'espace reçoit ses types de la couche
  # d'accès. Un segment `prisma` ou `db` OÙ QU'IL SOIT dans le chemin compte (`../db/index` est
  # le client sous un autre nom), AVEC OU SANS suffixe pointé — extension de fichier,
  # déclaration `.d.ts`, ou suffixe de convention comme `db.server` : sous `moduleResolution:
  # "bundler"` (tsconfig.json:5), `../lib/prisma.js` et `../lib/prisma` résolvent le MÊME
  # fichier. `@prisma/` et `.prisma/` comptent aussi DERRIÈRE un chemin
  # (`../../node_modules/@prisma/client`). Les chargeurs comptent tous : `import`, `require`,
  # `import()` (avec ou sans attributs), `module.require` et `module['require']`, le chargeur
  # fabriqué (`createRequire(…)(…)`), la liaison TypeScript `import x = require(…)` (exportée
  # ou non). Et un chargeur n'a droit qu'à l'APPEL DIRECT : `require` et `module.require` ne
  # sont ni ré-affectés, ni passés, ni appelés par `.call` / `.apply` / `.bind` — seul
  # `require.resolve` (un chemin, pas un module) reste admis. Tout cela vaut pour un spécifieur
  # et un chargeur écrits EN CLAIR : écrits par échappement (`'../../` + antislash + `db'`,
  # `requ` + échappement + `re(…)`), ils sont refusés en amont par le bras commun `&echappement`
  # (voir l'en-tête), avec ses exemptions et sa limite.
  #
  # LIMITES DÉCLARÉES (a, b et d ne sont pas fermées ici ; c l'est, par le texte) :
  #   a) un module HORS de ces dossiers qui ENVELOPPE le client et que l'espace importe n'est pas
  #      vu — c'est la couche d'accès cloisonnée et son test IDOR qui ferment ce chemin ; la
  #      tâche SEC-05 qui les livre AMENDE cette règle si elle doit la lister par modèle ;
  #   b) un spécifieur CALCULÉ (`import(variable)`, `module.require(variable)`, concaténation)
  #      n'est pas lisible statiquement ;
  #   c) `export type { … } from`, `export { type … } from` et `export import x = require(…)` ne
  #      sont PAS représentés par l'AST TypeScript de semgrep 1.176.1 (mesuré : le motif
  #      `export type { ... } from "$M"` ne compile même pas, et aucun motif d'import ne voit
  #      `export import`). Huit tours ont tenté de LIRE ces liaisons sur le texte (mots, blancs
  #      Unicode, liste entre accolades jusqu'à sa vraie fin) ; chaque lecture avait sa faille,
  #      la dernière un guillemet échappé dans une chaîne de la liste. Depuis le 9e tour, cette
  #      limite est fermée par un REFUS ENTIER PAR LE TEXTE : sous l'espace, tout fichier dont le
  #      texte contient `@prisma/` ou `.prisma/`, ou une chaîne dont un segment est `prisma` ou
  #      `db` (le segment de l'ancre `&specifieur-du-client`), est refusé, quelle que soit la
  #      forme qui porte la citation — liaison que l'AST voit ou non, directive
  #      `/// <reference types="@prisma/client" />`, commentaire, chaîne quelconque. Aucune liste
  #      n'est plus lue. `export type * from` n'est même pas analysé par 1.176.1 (mesuré :
  #      erreur de syntaxe partielle, que la gate juge faute `erreur_semgrep`) ;
  #   d) un chargeur obtenu AUTREMENT que par `require` ou une propriété `require` écrits sous
  #      l'espace — reçu en paramètre, déstructuré (`const { require: r } = module`), importé
  #      d'un module voisin — n'est pas suivi : l'appel `r('../db')` n'a rien qui le distingue
  #      d'un appel quelconque.
  # Prix ASSUMÉ : sous l'espace, `require.cache`, `require.main` et toute propriété `require`
  # d'un objet qui n'est pas appelée directement sont refusés aussi. Et, depuis le refus par le
  # texte : un COMMENTAIRE qui cite le client (`@prisma/client`, `'../db'`), une chaîne
  # quelconque dont un segment est `db` ou `prisma` (`fetch('/api/db')`), et un texte où une
  # barre oblique précède `db` puis un guillemet sur la même ligne sont refusés aussi. Aucun
  # fichier de l'espace ne les écrit (mesuré : 0 constat sur le dépôt).
  - id: axion-prisma-hors-couche-d-acces
    message: >-
      Accès direct au client de base sous l'espace apporteur (REQ-SEC-008). Toute lecture ou
      écriture de l'espace passe par la couche d'accès, qui injecte l'apporteurId de la session
      dans le `where`. Importez depuis la couche d'accès, jamais `@prisma/*`, `.prisma/*`, ni un
      module `prisma` ou `db` — avec ou sans suffixe, par quelque chargeur que ce soit. Sous
      l'espace, un fichier dont le TEXTE cite le client est refusé, commentaire et directive de
      types compris. Un nom écrit par séquence d'échappement est refusé comme tel : écrivez-le
      en clair.
    severity: ERROR
    languages: [typescript, javascript]
    paths:
      include:
        - "/src/app/(espace)/**"
        - "/src/server/espace/**"
    pattern-either:
      # La FAMILLE des liaisons de module, par l'AST. Mesuré : semgrep normalise
      # `export { X } from "M"` en import, d'où sa couverture par le motif d'accolades, et
      # `import x = require("M")` en appel `require`.
      - patterns:
          - pattern-either:
              - pattern: import $X from "$M"
              - pattern: import * as $X from "$M"
              - pattern: import { ... } from "$M"
              - pattern: import "$M"
              - pattern: require("$M")
              - pattern: $O.require("$M")
              - pattern: $O["require"]("$M")
              # Le chargeur fabriqué : `createRequire(import.meta.url)('…')`.
              - pattern: $F(...)("$M")
              - pattern: import("$M")
              - pattern: import("$M", $ATTRIBUTS)
              - pattern: export * as $X from "$M"
              - pattern: export * from "$M"
          - metavariable-regex: &specifieur-du-client
              metavariable: $M
              # `@prisma/…` ou `.prisma/…`, en tête ou derrière un chemin ; ou un SEGMENT entier
              # `prisma`/`db` — suivi de rien, de `/`, ou d'un suffixe POINTÉ (extension JS/TS,
              # déclaration `.d.ts`, `db.server`…). `prismatique`, `db-outils`, `dbx`,
              # `prisma-aide` ne sont PAS des segments `prisma`/`db` : ce qui suit le nom n'est
              # ni `/`, ni un point, ni la fin.
              regex: |-
                ^(.*/)?(@prisma/|\.prisma/|(prisma|db)(\.[^/]*)?(/|$))
      # Le chargeur hors de l'APPEL DIRECT : `const r = require`, `require.call(…)`,
      # `require.apply(…)`, `require.bind(…)`, paramètre par défaut. `require(…)` et
      # `require.resolve` (un chemin, pas un module) restent admis, et eux seuls.
      - patterns:
          - pattern: require
          - pattern-not-inside: require(...)
          - pattern-not-inside: require.resolve
      # … la même chose pour la propriété `require` d'un objet (`module.require`,
      # `module['require']`) : appelée directement, elle est jugée par son spécifieur ci-dessus ;
      # autrement, elle est refusée.
      - patterns:
          - pattern-either:
              - pattern: $O.require
              - pattern: $O["require"]
          - pattern-not-inside: $O.require(...)
          - pattern-not-inside: $O["require"](...)
      # … et la sortie écrite DANS les arguments d'un appel direct, que l'exclusion ci-dessus
      # couvrirait par sa portée (`require((r = require, './x'))`).
      - patterns:
          - pattern-either:
              - pattern: require(..., $A, ...)
              - pattern: $O.require(..., $A, ...)
              - pattern: $O["require"](..., $A, ...)
          - metavariable-pattern:
              metavariable: $A
              pattern-either:
                - pattern: require
                - pattern: $P.require
                - pattern: $P["require"]
      # Limite (c), REFUS ENTIER PAR LE TEXTE (9e tour, revues `exactitude` 5329829625 et
      # `securite` 5329828516, PR 82) : plus aucune lecture de liaison. Sous l'espace, tout
      # fichier dont le TEXTE cite le client est refusé, où que la citation soit — liaison
      # (`export type { … } from`, `export { type … } from`, `import`, `require`), directive
      # `/// <reference types=…>`, commentaire ou chaîne quelconque :
      #   — `@prisma/` ou `.prisma/`, n'importe où dans le texte (`@prisma/client` compris) ;
      #   — un guillemet (simple, double ou accent grave), un chemin facultatif sans guillemet ni
      #     fin de ligne, puis un SEGMENT `prisma` ou `db` — le segment de l'ancre
      #     `&specifieur-du-client`, avec ou sans suffixe pointé — suivi d'une barre oblique ou
      #     d'un guillemet.
      # Une liste entre accolades n'est plus lue du tout : un guillemet échappé, une accolade
      # dans un commentaire ou une chaîne ne changent rien à ce que le texte cite.
      - pattern-regex: |-
          [@.]prisma/
      - pattern-regex: |-
          ['"`](?:[^'"`\n\r\x{2028}\x{2029}]*/)?(?:prisma|db)(?:\.[^/'"`\n\r\x{2028}\x{2029}]*)?(?:/|['"`])
      - patterns:
          - pattern-regex: |-
              (?<![\p{ID_Continue}$\x{200C}\x{200D}.#])import(?![\p{ID_Continue}$\x{200C}\x{200D}])(?:[\t\n\x0B\f\r\x{0085}\x{200B}\x{2028}\x{2029}\x{FEFF}\p{Zs}]|/\*(?:[^*]|\*(?!/))*\*/|//[^\n\r\x{2028}\x{2029}]*)*[^\t\n\x0B\f\r\x{0085}\x{200B}\x{2028}\x{2029}\x{FEFF}\p{Zs}{}()\[\];,:.=*'"`<>!?+\-&|^~%@#/](?:(?:[\t\n\x0B\f\r\x{0085}\x{200B}\x{2028}\x{2029}\x{FEFF}\p{Zs}]|/\*(?:[^*]|\*(?!/))*\*/|//[^\n\r\x{2028}\x{2029}]*)|[^\t\n\x0B\f\r\x{0085}\x{200B}\x{2028}\x{2029}\x{FEFF}\p{Zs}{}()\[\];,:.=*'"`<>!?+\-&|^~%@#/])*=(?:[\t\n\x0B\f\r\x{0085}\x{200B}\x{2028}\x{2029}\x{FEFF}\p{Zs}]|/\*(?:[^*]|\*(?!/))*\*/|//[^\n\r\x{2028}\x{2029}]*)*require(?![\p{ID_Continue}$\x{200C}\x{200D}])(?:[\t\n\x0B\f\r\x{0085}\x{200B}\x{2028}\x{2029}\x{FEFF}\p{Zs}]|/\*(?:[^*]|\*(?!/))*\*/|//[^\n\r\x{2028}\x{2029}]*)*\((?:[\t\n\x0B\f\r\x{0085}\x{200B}\x{2028}\x{2029}\x{FEFF}\p{Zs}]|/\*(?:[^*]|\*(?!/))*\*/|//[^\n\r\x{2028}\x{2029}]*)*['"`](?P<M>[^'"`]*)['"`]
          - metavariable-regex: *specifieur-du-client
      - pattern: new PrismaClient(...)
      - pattern: new $P.PrismaClient(...)
      # L'ÉCHAPPEMENT (voir l'en-tête) : le bras commun aux deux règles, défini ici et réutilisé
      # par la règle n° 2. Deux expressions sur le TEXTE, hors du corps d'une expression
      # régulière littérale et hors du texte d'un gabarit `String.raw` ; puis TOUTE
      # interpolation d'un `String.raw`, refusée comme classe (bras suivant).
      - patterns: &echappement
          - pattern-either: &echappements-refuses
              # `u` + quatre chiffres, `u{…}`, `x` + deux chiffres, d'un caractère IMPRIMABLE :
              # contrôle (0 à 1F) et DEL (7F) sont écartés par anticipation négative.
              - pattern-regex: |-
                  (?<!\\)(?:\\\\)*\\(?:u(?!00[01][0-9A-Fa-f]|007[Ff])[0-9A-Fa-f]{4}|u\{(?!0*(?:[01]?[0-9A-Fa-f]|7[Ff])\})[0-9A-Fa-f]+\}|x(?![01][0-9A-Fa-f]|7[Ff])[0-9A-Fa-f]{2})
              # Un antislash NON échappé suivi d'autre chose qu'un échappement courant (`u` et
              # `x` sont jugés ci-dessus) : identité, barre oblique, dollar, continuation — le
              # saut de ligne n'est pas dans la liste admise —, ou `0` suivi d'un chiffre (octal
              # hérité ; les chiffres 1 à 9 tombent déjà sous l'identité).
              - pattern-regex: |-
                  (?<!\\)(?:\\\\)*\\(?:[^\\'"`nrtbfv0ux]|0[0-9])
          - pattern-not-inside: /.../
          - pattern-not-inside: String.raw`...`
      # L'INTERPOLATION BRUTE, refusée comme CLASSE (revue `exactitude` 5328789820, PR 82) : un
      # `String.raw` rend chaque interpolation déjà ÉVALUÉE, donc un littéral de chaîne écrit par
      # échappement (`String.raw` + gabarit + `${'…'}`) y arrive DÉCODÉ, parenthésé ou non, entre
      # guillemets simples ou doubles. Rejuger l'interpolation par le bras textuel ne voyait pas
      # ce littéral ; le refus porte donc sur la FORME : un gabarit `String.raw` n'a droit qu'à
      # son texte, sans `${…}`. MESURÉ sur 1.176.1 : semgrep REPLIE une interpolation littérale
      # dans le texte du gabarit, et `String.raw` + gabarit + `...${$A}...` ne la voit pas (il
      # ne voit que `${x}`, `${1}`). Le bras prend donc le gabarit par le motif MÊME de
      # l'exemption ci-dessus, et le TEXTE de son étendue par une ouverture `${` qu'aucun
      # antislash n'échappe (un antislash seul devant `${` en fait du texte ; un antislash
      # doublé, non) : tout gabarit que l'exemption couvre et qui interpole est refusé, sur la
      # ligne de l'ouverture.
      - patterns: &interpolation-brute
          - pattern: String.raw`...`
          - pattern-regex: |-
              (?<!\\)(?:\\\\)*\$\{

  # SQL brut non paramétré. Les noms `$queryRawUnsafe` et `$executeRawUnsafe` écrits EN CLAIR
  # sont refusés où qu'ils soient sous `src/`, et toute liaison IMPORT-EQUALS aussi (deux classes,
  # voir l'en-tête). Pour le reste, ce que la règle refuse est une RÉFÉRENCE au membre
  # dangereux — `Prisma.raw`, `Prisma.Sql`, et, du runtime, `raw`, `Sql`, `sqltag`, `join`,
  # `makeTypedQueryFactory` —, écrite EN CLAIR (écrite par échappement, elle est refusée en amont
  # par le bras commun `&echappement`, voir l'en-tête), par toute écriture que l'AST rend
  # lisible : membre pointé, optionnel ou non nul, accès calculé par littéral (guillemets ou
  # gabarit), déstructuration, renommage à l'import, espace de noms, objet module (espace de
  # noms, défaut, `require`, `import()` attendu). Le nom écrit comme chaîne HORS d'un accès
  # calculé (argument de `Reflect.get`, clé calculée de déstructuration, chaîne quelconque)
  # n'est refusé que pour `$queryRawUnsafe`, `$executeRawUnsafe` (y compris replié d'une
  # concaténation de littéraux), `Prisma` et `constructor` : un membre du runtime n'est pris
  # par crochets que sur un objet module resté dans sa liaison (limite d). Pour `Prisma`, c'est
  # une LISTE BLANCHE qui tient (9e tour) : comme VALEUR, le nom n'a droit qu'à `Prisma.sql`,
  # `Prisma.join`, `Prisma.empty` et `Prisma.PrismaClientKnownRequestError`, écrits en clair,
  # et toute autre apparition est refusée ; son NOM écrit comme chaîne l'est aussi (voir
  # l'en-tête). La déstructuration de `Prisma` étant refusée à sa source, les bras qui suivent
  # `sql` et `join` déstructurés ne sont plus qu'un second filet. Trois familles s'y ajoutent :
  #   — les fonctions d'ÉTIQUETTE `$queryRaw`, `$executeRaw` et `Prisma.sql` ne sont admises
  #     qu'en étiquette d'un gabarit : appelées avec
  #     un tableau (`Prisma.sql([x])`, `p.$queryRaw([x] as unknown as TemplateStringsArray)`),
  #     par `.call` / `.apply`, rangées ou passées, leurs « morceaux » sont du TEXTE ;
  #   — `Prisma.join` n'est admis qu'avec UNE valeur : séparateur, préfixe et suffixe sont
  #     insérés en TEXTE ; un appel étalé (`join(...a)`) ou une sortie de la fonction le sont
  #     aussi ;
  #   — la lecture d'un CONSTRUCTEUR (`x.constructor`, `x['constructor']`) : elle rend la classe
  #     `Sql` depuis n'importe quelle valeur du namespace (`Prisma.empty`, `Prisma.join(…)`).
  #
  # LIMITES DÉCLARÉES, et elles bornent les phrases ci-dessus :
  #   a) une clé que semgrep ne réduit pas à une constante (`p[k]`, `C[k]` sur l'objet module, où
  #      `k` est un paramètre ou vient d'un autre module) n'est pas lisible sans analyse de
  #      teinte. Mesuré : une concaténation de littéraux (`p['$query' + 'RawUnsafe']`) est
  #      repliée, donc prise ; et sur `Prisma`, tout accès calculé, littéral ou non (`Prisma[k]`),
  #      est pris par la liste blanche ;
  #   b) FERMÉE depuis le 9e tour : la déstructuration de `Prisma` à clé calculée
  #      (`const { ['raw']: r } = Prisma`), que semgrep 1.176.1 ne représente par aucun motif,
  #      est refusée avec TOUTE déstructuration de `Prisma` — `Prisma` à droite du `=` est une
  #      valeur hors liste. Le `sql` paramétré déstructuré est refusé avec elle : c'est le prix
  #      de la règle stricte, écrire `Prisma.sql` ;
  #   c) un module tiers qui ré-exporte `raw` (ou `Sql`, `sqltag`…) sous un autre nom n'est pas
  #      vu, ni un module HORS de `src/` qui ré-exporte le namespace sous un autre nom (sous
  #      `src/`, ré-export et renommage du namespace sont des apparitions hors liste, refusées) ;
  #   d) l'objet module d'un spécifieur du client (espace de noms, `require`, `import()`) qui
  #      QUITTE sa liaison — rangé dans un objet, passé en argument, `.then((m) => m.raw)` —
  #      n'est pas suivi pour les membres du runtime : la liste blanche ne vaut que pour le nom
  #      `Prisma` (et `C.Prisma` sur l'objet module), parce que la couche d'accès a le droit,
  #      elle, de manipuler l'objet module du client ;
  #   e) le PROTOTYPE de `Sql` atteint sans lire `.constructor` — `Object.getPrototypeOf(…)`,
  #      `Object.create(…)`, `Object.setPrototypeOf(…)`, `__proto__` — permet de forger un
  #      fragment sans être vu ;
  #   f) une fonction d'étiquette ou `join` obtenue AUTREMENT que par les écritures ci-dessus —
  #      reçue en paramètre, ré-exportée par un module voisin — n'est pas suivie : son appel
  #      avec un tableau n'a rien qui le distingue d'un appel quelconque.
  # Prix ASSUMÉ, sous `src/` : `typeof Prisma` et `typeof p.$queryRaw` en position de type, une
  # propriété `.Prisma` d'un objet quelconque qu'on range ailleurs, une chaîne EXACTEMENT égale
  # à `Prisma` ou à `constructor`, toute lecture de `.constructor`, l'écriture calculée
  # `C['Prisma'].sql`, et `Prisma.join(v, ', ')` à séparateur littéral sont refusés aussi —
  # l'AST de semgrep ne les distingue pas d'une sortie. Et, depuis la liste blanche : tout
  # membre de VALEUR hors des quatre (`new Prisma.Decimal(…)`, `Prisma.validator`), toute
  # déstructuration de `Prisma` (`{ sql } = Prisma` compris), la liaison du namespace par
  # déstructuration (`{ Prisma } = await import(…)`), `C.Prisma.sql` par l'objet module et
  # `P.sql` après `import { Prisma as P }`, tout renommage du namespace à l'import (même
  # `import type`) ou au ré-export, tout ré-export du namespace, toute clause d'héritage qui
  # écrit `Prisma` (même `extends Prisma.PrismaClientKnownRequestError`), et une clé `Prisma`
  # suivie de `:` — dans un objet, un type littéral ou un COMMENTAIRE (`Prisma :`) — sont
  # refusés. Aucun fichier de `src/` ne les écrit (mesuré : 0 constat sur le dépôt).
  - id: axion-sql-brut-non-parametre
    message: >-
      SQL brut NON paramétré : `$queryRawUnsafe`, `$executeRawUnsafe`, `Prisma.raw`,
      `Prisma.Sql` et les membres du runtime (`raw`, `Sql`, `sqltag`, `join`,
      `makeTypedQueryFactory`) concatènent une chaîne dans la requête. Utilisez le gabarit
      étiqueté (`$queryRaw` / `$executeRaw` avec des backticks, ou `Prisma.sql`), qui paramètre
      chaque valeur, et `Prisma.join(valeurs)` sans séparateur. Comme VALEUR, le namespace
      `Prisma` n'a droit qu'à `Prisma.sql`, `Prisma.join`, `Prisma.empty` et
      `Prisma.PrismaClientKnownRequestError`, écrits en clair : renommage, accès par crochets,
      déstructuration, héritage, alias, passage par une variable, un objet ou un paramètre sont
      refusés, et l'appel d'une étiquette sans gabarit aussi. Les noms `$queryRawUnsafe` et `$executeRawUnsafe` sont refusés où qu'ils soient
      écrits, et toute liaison `import X = …` aussi (écrivez un `import` ES). Un nom écrit par
      séquence d'échappement est refusé comme tel : écrivez-le en clair.
    severity: ERROR
    languages: [typescript, javascript]
    paths:
      include:
        - "/src/**"
    pattern-either:
      # — le NOM écrit par échappement, où qu'il soit sous `src/` : le bras commun de la règle
      #   n° 1 (voir l'en-tête), et toute interpolation d'un `String.raw`. C'est lui qui rend
      #   vraie la suite : les motifs ci-dessous ne lisent qu'un nom écrit EN CLAIR. —
      - patterns: *echappement
      - patterns: *interpolation-brute
      # — les membres `…Unsafe`, refusés comme CLASSE par leur NOM écrit en clair, où qu'il soit
      #   sous `src/` (revue `exactitude` 5328984956, PR 82) : membre pointé, optionnel ou non
      #   nul, identifiant nu, clé de déstructuration — déclaration, paramètre de fonction ou de
      #   flèche, affectation, `for … of`, imbriquée —, clé ou méthode d'objet, chaîne, gabarit,
      #   commentaire. Aucun usage légitime n'existe, et un motif AST par écriture a manqué
      #   chaque déstructuration renommée hors de `var { … } = …`. La borne du mot tient compte
      #   du `$` : `$queryRawUnsafely` ou `queryRaw` ne sont pas ce nom. —
      - pattern-regex: |-
          (?<![\w$])\$(?:query|execute)RawUnsafe(?![\w$])
      # Le nom que semgrep REPLIE en constante sans qu'aucun texte ne l'écrive : concaténation de
      # littéraux (`p['$query' + 'RawUnsafe']`, limite a). Un littéral de chaîne dans le motif
      # matche aussi un gabarit sans substitution (mesuré).
      - pattern: '"$queryRawUnsafe"'
      - pattern: '"$executeRawUnsafe"'
      # — la liaison TypeScript IMPORT-EQUALS (`import X = …`, `export import X = …`), refusée
      #   comme CLASSE quelle qu'en soit la cible (revue `exactitude` 5328984956, PR 82) :
      #   `import P = Prisma` fait sortir le namespace par une liaison que la liste blanche ne
      #   voit pas (l'AST de semgrep 1.176.1 ne la représente pas, mesuré), et `import x =
      #   require(…)` charge un module hors des liaisons ES. Lue sur le TEXTE, commentaires admis
      #   entre les mots (`import /* … */ P = Prisma`) ; `import type P = …` compris. Le bras ne
      #   dépend PLUS de la forme de l'identifiant (revue `securite` 5329281085, PR 82) : après
      #   le mot `import` borné en Unicode, tout ce qui n'est ni blanc Unicode, ni commentaire, ni
      #   ponctuation ASCII, jusqu'à un `=` qui n'est ni `==` ni `=>` (voir l'en-tête, « LE TEXTE
      #   N'EST PAS ASCII »). —
      - pattern-regex: |-
          (?<![\p{ID_Continue}$\x{200C}\x{200D}.#])import(?![\p{ID_Continue}$\x{200C}\x{200D}])(?:[\t\n\x0B\f\r\x{0085}\x{200B}\x{2028}\x{2029}\x{FEFF}\p{Zs}]|/\*(?:[^*]|\*(?!/))*\*/|//[^\n\r\x{2028}\x{2029}]*)*[^\t\n\x0B\f\r\x{0085}\x{200B}\x{2028}\x{2029}\x{FEFF}\p{Zs}{}()\[\];,:.=*'"`<>!?+\-&|^~%@#/](?:(?:[\t\n\x0B\f\r\x{0085}\x{200B}\x{2028}\x{2029}\x{FEFF}\p{Zs}]|/\*(?:[^*]|\*(?!/))*\*/|//[^\n\r\x{2028}\x{2029}]*)|[^\t\n\x0B\f\r\x{0085}\x{200B}\x{2028}\x{2029}\x{FEFF}\p{Zs}{}()\[\];,:.=*'"`<>!?+\-&|^~%@#/])*=(?![=>])
      # — `Prisma.raw` et `Prisma.Sql`, par leur nom QUALIFIÉ (doublés depuis le 9e tour par la
      #   liste blanche, qui les refuse comme membres hors liste) : `$C.Prisma.raw` matche
      #   `Prisma.raw` (import nommé), `P.raw` (`import { Prisma as P }`) et `C.Prisma.raw`
      #   (`import * as C`), et ne matche PAS `autre.raw` ni `String.raw`, qui ne sont pas le
      #   `Prisma` de `@prisma/client`. `new Prisma.Sql([x], [])` range `x` dans le TEXTE.
      - pattern: $C.Prisma.raw
      - pattern: Prisma.raw
      - pattern: $C.Prisma["raw"]
      - pattern: $C.Prisma.Sql
      - pattern: $C.Prisma["Sql"]
      # Déstructuration, forme courte comme renommée, au milieu d'autres clés (mesuré).
      - pattern: "var { raw: $B } = $C.Prisma"
      - pattern: "var { Sql: $B } = $C.Prisma"
      # Ré-affectation locale de l'espace de noms, puis usage : la ligne de l'usage est nommée
      # (la ligne de la ré-affectation l'est aussi, par la liste blanche ci-dessous).
      - patterns:
          - pattern: $P.raw
          - pattern-inside: |
              var $P = $C.Prisma;
              ...
      # — LA LISTE BLANCHE DU NAMESPACE COMME VALEUR (9e tour, revue `securite` 5329828516,
      #   PR 82). Le nom `Prisma` en position de VALEUR n'a droit qu'à QUATRE formes, écrites en
      #   clair `Prisma.<nom>` : `Prisma.sql` et `Prisma.join` (les constructeurs paramétrés que
      #   ce message recommande, jugés ensuite par les familles d'étiquette et de `join`),
      #   `Prisma.empty`, et `Prisma.PrismaClientKnownRequestError` (la seule forme de valeur
      #   relevée sur le dépôt, en `instanceof`). TOUTE autre apparition de la valeur est
      #   refusée : autre membre (`Prisma.raw`, `Prisma.Sql`, `new Prisma.Decimal`), membre
      #   calculé (`Prisma[…]`), déstructuration de `Prisma` ou liaison du namespace par une
      #   déstructuration (`{ Prisma } = await import(…)`, `{ Prisma } = C` sur l'objet de
      #   l'import par défaut), alias (`const P = Prisma`), argument, valeur rendue, `export {
      #   Prisma }`, chaînage optionnel ou non nul, et `C.Prisma` par l'objet module. La
      #   résolution d'alias de semgrep rattache à ce nom un `import { Prisma as P }` : `P.sql`
      #   est refusé comme `P.raw` (mesuré), seule l'écriture en clair `Prisma.<nom>` passe. Les
      #   positions de TYPE restent libres : l'AST de semgrep 1.176.1 ne rend pas `Prisma.X`
      #   d'une annotation, d'une assertion `as` ou d'une contrainte de générique comme une
      #   valeur (mesuré) — sauf `typeof Prisma…`, qui LIT la valeur (prix ci-dessous).
      - patterns:
          - pattern-either:
              - pattern: $C.Prisma
              - pattern: Prisma
          - pattern-not-inside: Prisma.sql
          - pattern-not-inside: Prisma.join
          - pattern-not-inside: Prisma.empty
          - pattern-not-inside: Prisma.PrismaClientKnownRequestError
          - pattern-not-inside: import { ... } from "$M"
      # … l'import qui RENOMME le namespace (`import { Prisma as P }`, `import type` compris, et
      #   `export { Prisma as Q } from …`, que semgrep normalise en import) : sans lui, aucun
      #   autre nom que `Prisma` ne désigne le namespace, et c'est ce qui rend lisibles par le
      #   TEXTE les deux bras suivants.
      - patterns:
          - pattern: import { ..., Prisma as $Q, ... } from "$M"
          - metavariable-regex:
              metavariable: $Q
              regex: ^(?!Prisma$)
      # … une CLÉ `Prisma` suivie de `:` — déstructuration renommée dans TOUTE position
      #   (déclaration, paramètre, affectation, `for … of`, `catch`, imbriquée), clé d'objet ou
      #   de type littéral —, lue sur le TEXTE, nom nu ou entre guillemets, blancs Unicode et
      #   commentaires admis avant les deux-points. Refus textuel, parce qu'un motif AST par
      #   position de déstructuration a manqué `for … of` (mesuré).
      - pattern-regex: |-
          (?:(?<![\p{ID_Continue}$\x{200C}\x{200D}.#])Prisma(?![\p{ID_Continue}$\x{200C}\x{200D}])|'Prisma'|"Prisma")(?:[\t\n\x0B\f\r\x{0085}\x{200B}\x{2028}\x{2029}\x{FEFF}\p{Zs}]|/\*(?:[^*]|\*(?!/))*\*/|//[^\n\r\x{2028}\x{2029}]*)*:
      # … la CLAUSE D'HÉRITAGE d'une classe, nommée ou anonyme, dont l'expression écrit le nom
      #   `Prisma` : l'AST de semgrep 1.176.1 ne rend pas cette expression comme une valeur (le
      #   motif de valeur n'y mord pas, et un `metavariable-pattern` sur elle échoue en erreur
      #   interne, mesuré) ; elle est donc jugée sur son TEXTE. La contrainte d'un générique
      #   (`class L<T extends Prisma.TransactionClient>`) n'est pas la clause d'héritage.
      - patterns:
          - pattern-either:
              - pattern: class $K extends $E { ... }
              - pattern: class extends $E { ... }
          - metavariable-regex:
              metavariable: $E
              regex: (?<![\p{ID_Continue}$\x{200C}\x{200D}#])Prisma(?![\p{ID_Continue}$\x{200C}\x{200D}])
      # Le NOM du namespace écrit comme chaîne, où qu'elle soit : `C['Prisma']` sur l'objet
      # module quel que soit son chargeur (espace de noms, défaut, `require(…)`, `import()`
      # attendu), ``C[`Prisma`]``, `Reflect.get(C, 'Prisma')`, clé calculée de déstructuration.
      # Le motif prend aussi le gabarit sans substitution (mesuré). Par symétrie, le MEMBRE
      # calculé est pris par les motifs `["raw"]` / `["Sql"]` et par ceux du runtime ci-dessous.
      - pattern: '"Prisma"'
      # — LE NAMESPACE EN NOM D'ÉLÉMENT JSX (10e tour, revue `exactitude` 5329988928, PR 82) :
      #   `<Prisma.raw />` n'est pas rendu comme une VALEUR par l'AST, la liste blanche ne le voit
      #   donc pas. Le JSX n'a aucun usage légitime du namespace. Le bras juge l'ÉLÉMENT JSX
      #   lui-même — et non le texte autour du chevron — en liant son nom à `$EL`. Conséquence
      #   mesurée : un argument de type (`Promise<Prisma.X>`) n'est pas un élément JSX pour le
      #   parseur, donc AUCUN faux positif n'est à payer sur les arguments de type ; et un élément
      #   écrit dans le TEXTE d'un enfant (`<b>x<Prisma.raw /></b>`) ou derrière un `return` collé
      #   est pris comme les autres, que le texte seul ne saurait pas distinguer. Mesuré sur 31 cas
      #   (image épinglée 1.176.1) : 17 témoins rouges — attribut seul, paire ouvrante/fermante,
      #   blancs autour du point, flèche collée, parenthèse, tableau, `return` `yield` `else` `do`
      #   `in` `instanceof` collés, deux formes multi-lignes, fichier `.jsx`, fragment, enfant JSX —
      #   et 14 contre-témoins muets : tous les arguments de type, `<PrismaCard />`, l'assertion à
      #   chevrons `<Prisma.X>valeur` d'un `.ts`, un générique nommé `Margin<…>`, un fragment sain.
      - patterns:
          - pattern-either:
              - pattern: <$EL ... />
              - pattern: <$EL ...>...</$EL>
          - metavariable-regex:
              metavariable: $EL
              regex: '^Prisma(\s*\.|$)'
      # — LE MODULE D'EXÉCUTION ET LES SOUS-CHEMINS DU CLIENT, refusés par leur TEXTE (10e tour,
      #   revue `securite` 5329989967, PR 82) : l'objet module du runtime qui quitte sa liaison
      #   (`import * as L` puis `const { raw: r } = L`, import par défaut puis `{ sqltag }`)
      #   n'est pas suivi (limite d). Plutôt que de le suivre, la règle refuse sous `src/` toute
      #   citation de `.prisma/` et toute citation de `@prisma/` qui n'est pas EXACTEMENT
      #   `@prisma/client` suivi d'un guillemet — `@prisma/client/runtime/…`, `@prisma/client/sql`,
      #   un autre paquet `@prisma/…`.
      #
      #   LA CITATION DOIT AVOIR LA FORME D'UN SPÉCIFIEUR (11e tour, mesuré) : entre guillemets,
      #   sans blanc. La version précédente lisait le texte « où qu'il soit, commentaire compris »,
      #   et rougissait donc une phrase française qui NOMME le client pour dire qu'on ne l'importe
      #   pas — mesuré sur le contre-témoin `acces/prix-commentaire-cite-le-client`, dont
      #   l'apostrophe de « L'espace » tenait le rôle du guillemet ouvrant. Un spécifieur réel est
      #   toujours cité et ne porte jamais d'espace ; exiger cette forme ne perd donc aucune
      #   liaison, et rend la prose écrivable. `REGLE_PRISMA` refuse déjà la citation en prose hors
      #   de la couche d'accès : ce prix est payé une fois, pas deux.
      #   Le dépôt n'en cite aucune (mesuré : ses 13 citations sont `'@prisma/client'`).
      - pattern-regex: |-
          ['"`][^'"`\s]*(?:\.prisma/|@prisma/(?!client['"`]))[^'"`\s]*['"`]
      # — LE RELAIS EN BLOC (même revue) : `export *` (avec ou sans `as`, `export type *` compris)
      #   dont le spécifieur désigne le client, un module `prisma`/`db` ou le runtime — l'ancre
      #   `&specifieur-du-client` —, lu sur le TEXTE, blancs Unicode et commentaires admis entre
      #   les mots, et refusé partout sous `src/` : il fait sortir tous les membres du module sous
      #   un autre spécifieur, que plus rien ne reconnaît (`import { raw } from './relais'`). Entre
      #   l'étoile et `from`, le bras saute commentaires et chaînes (`as "nom"`) et s'arrête au
      #   premier point-virgule hors d'eux.
      - patterns:
          - pattern-regex: |-
              (?<![\p{ID_Continue}$\x{200C}\x{200D}.#])export(?![\p{ID_Continue}$\x{200C}\x{200D}])(?:[\t\n\x0B\f\r\x{0085}\x{200B}\x{2028}\x{2029}\x{FEFF}\p{Zs}]|/\*(?:[^*]|\*(?!/))*\*/|//[^\n\r\x{2028}\x{2029}]*)*(?:type(?![\p{ID_Continue}$\x{200C}\x{200D}])(?:[\t\n\x0B\f\r\x{0085}\x{200B}\x{2028}\x{2029}\x{FEFF}\p{Zs}]|/\*(?:[^*]|\*(?!/))*\*/|//[^\n\r\x{2028}\x{2029}]*)*)?\*(?:/\*(?:[^*]|\*(?!/))*\*/|//[^\n\r\x{2028}\x{2029}]*|'[^'\n\r]*'|"[^"\n\r]*"|[^;'"`])*?from(?:[\t\n\x0B\f\r\x{0085}\x{200B}\x{2028}\x{2029}\x{FEFF}\p{Zs}]|/\*(?:[^*]|\*(?!/))*\*/|//[^\n\r\x{2028}\x{2029}]*)*['"`](?P<M>[^'"`]*)['"`]
          - metavariable-regex: *specifieur-du-client
      # — LE NAMESPACE EN NOM D'ÉLÉMENT JSX (10e tour, revue `exactitude` 5329988928, PR 82) :
      #   `<Prisma.raw />` n'est pas rendu comme une valeur par l'AST, la liste blanche ne le voit
      #   pas. Le JSX n'a aucun usage légitime du namespace : TOUT chevron `<`, suivi de blancs
      #   Unicode ou de commentaires, puis du nom `Prisma` borné (non suivi d'un caractère
      #   d'identifiant), est refusé, QUEL QUE SOIT ce qui précède le chevron. Aucune exemption
      #   par le contexte : un chevron collé à un mot ouvre des arguments de type
      #   (`Promise<Prisma.X>`), mais aussi un élément dans le texte d'un enfant JSX
      #   (`<b>x<Prisma.raw /></b>`) ou derrière un `return` collé — le texte ne les distingue
      #   pas. Prix ci-dessous : un argument de type écrit `Prisma.X` directement.
      - pattern-regex: |-
          <(?:[\t\n\x0B\f\r\x{0085}\x{200B}\x{2028}\x{2029}\x{FEFF}\p{Zs}]|/\*(?:[^*]|\*(?!/))*\*/|//[^\n\r\x{2028}\x{2029}]*)*Prisma(?![\p{ID_Continue}$\x{200C}\x{200D}])
      # — LE NOM D'ÉLÉMENT JSX **QUALIFIÉ** (11e tour, mesure publiée en `issuecomment-5861172534`,
      #   puis CORRIGÉ au 12e tour par la revue `securite` sur `b9579bf`).
      #   Les trois bras ci-dessus laissaient passer `<C.Prisma.raw />` sous
      #   `import * as C from '@prisma/client'` : l'AST parce que `metavariable-regex` sur `$EL` ne
      #   mord plus au-delà de DEUX segments (`<C.Prisma.raw />` et `<a.b.Prisma.raw />` muets,
      #   mesuré) ; le bras au texte parce qu'il s'ancre sur `<` suivi de `Prisma` et ne franchit
      #   pas le préfixe ; le bras des sous-chemins parce que l'import est EXACTEMENT
      #   `'@prisma/client'`. Ce cas n'était donc fermé par RIEN.
      #
      #   CE QUE LA PREMIÈRE VERSION LISAIT MAL, et pourquoi ce n'était pas un détail. Elle
      #   s'écrivait en ASCII (`[A-Za-z0-9_$]`, `\s`) alors que les autres bras textuels de cette
      #   règle lisent `\p{ID_Continue}` et la classe des blancs Unicode ET des commentaires.
      #   Quatre formes passaient, mesurées par la revue `securite` : un alias non-ASCII
      #   (`<Cé.Prisma.raw />`), un commentaire dans le chemin (`<C/**/.Prisma.raw />`), un blanc
      #   insécable avant le point, et `else<C.Prisma.raw />` — que la GARDE ARRIÈRE refusait, sa
      #   liste de mots-clés ne portant ni `else`, ni `do`, `in`, `of`, `typeof`, `void`, `delete`,
      #   `new`, `instanceof`. Une liste de mots-clés est un inventaire, et un inventaire s'oublie.
      #
      #   LA GARDE ARRIÈRE EST DONC ABANDONNÉE : aucune exemption par le contexte, comme le bras au
      #   texte qui précède. Son PRIX est déjà payé par celui-ci — un argument de type écrit
      #   `Prisma.X` directement est refusé, l'alias de type le porte — et s'étend maintenant au
      #   générique QUALIFIÉ (`Promise<N.Prisma.X>`) : témoin `prix-generique-prisma-qualifie`.
      #   Payer deux fois le même prix ne coûte rien de plus ; oublier un mot-clé, si.
      #
      #   LIMITE DÉCLARÉE, mesurée et non contournée : le chevron doit être suivi du chemin, donc
      #   `Map<string, Prisma.X>` reste muet — le chemin n'y commence pas au chevron. Fermer cela
      #   demanderait de refuser `Prisma.` partout dans un `.tsx`, ce que la liste blanche de la
      #   règle admet par ailleurs pour de bonnes raisons. Ce bras ferme le NOM D'ÉLÉMENT, pas
      #   toute mention du namespace.
      #
      #   Le second motif prend le cas où le namespace est ALIASÉ hors de vue (`<L.raw>`, runtime)
      #   en jugeant le MEMBRE, et non le namespace.
      - pattern-regex: |-
          <(?:[\t\n\x0B\f\r\x{0085}\x{200B}\x{2028}\x{2029}\x{FEFF}\p{Zs}]|/\*(?:[^*]|\*(?!/))*\*/|//[^\n\r\x{2028}\x{2029}]*)*/?(?:[\t\n\x0B\f\r\x{0085}\x{200B}\x{2028}\x{2029}\x{FEFF}\p{Zs}]|/\*(?:[^*]|\*(?!/))*\*/|//[^\n\r\x{2028}\x{2029}]*)*(?:[\p{ID_Continue}$\x{200C}\x{200D}]+(?:[\t\n\x0B\f\r\x{0085}\x{200B}\x{2028}\x{2029}\x{FEFF}\p{Zs}]|/\*(?:[^*]|\*(?!/))*\*/|//[^\n\r\x{2028}\x{2029}]*)*\.(?:[\t\n\x0B\f\r\x{0085}\x{200B}\x{2028}\x{2029}\x{FEFF}\p{Zs}]|/\*(?:[^*]|\*(?!/))*\*/|//[^\n\r\x{2028}\x{2029}]*)*)*Prisma(?:[\t\n\x0B\f\r\x{0085}\x{200B}\x{2028}\x{2029}\x{FEFF}\p{Zs}]|/\*(?:[^*]|\*(?!/))*\*/|//[^\n\r\x{2028}\x{2029}]*)*\.
      - pattern-regex: |-
          <(?:[\t\n\x0B\f\r\x{0085}\x{200B}\x{2028}\x{2029}\x{FEFF}\p{Zs}]|/\*(?:[^*]|\*(?!/))*\*/|//[^\n\r\x{2028}\x{2029}]*)*/?(?:[\t\n\x0B\f\r\x{0085}\x{200B}\x{2028}\x{2029}\x{FEFF}\p{Zs}]|/\*(?:[^*]|\*(?!/))*\*/|//[^\n\r\x{2028}\x{2029}]*)*(?:[\p{ID_Continue}$\x{200C}\x{200D}]+(?:[\t\n\x0B\f\r\x{0085}\x{200B}\x{2028}\x{2029}\x{FEFF}\p{Zs}]|/\*(?:[^*]|\*(?!/))*\*/|//[^\n\r\x{2028}\x{2029}]*)*\.(?:[\t\n\x0B\f\r\x{0085}\x{200B}\x{2028}\x{2029}\x{FEFF}\p{Zs}]|/\*(?:[^*]|\*(?!/))*\*/|//[^\n\r\x{2028}\x{2029}]*)*)+(?:raw|Sql|sqltag|join|makeTypedQueryFactory)(?![\p{ID_Continue}$\x{200C}\x{200D}])
      # — LA DÉSTRUCTURATION D'UNE MÉTHODE BRUTE (12e tour, revue `securite` sur `28f62d7`,
      #   témoins c06, c09, c21). La liste `&hors-etiquette` juge la RÉFÉRENCE `p.$queryRaw` : elle
      #   ne voit rien quand le nom sort de l'objet par un MOTIF de déstructuration, puis s'appelle
      #   par `.call` ou `.apply` avec un tableau forgé :
      #     const { $queryRaw: q2 } = p;   q2.call(p, [`SELECT ${x}`]);
      #     const { $queryRaw } = p;       $queryRaw.apply(p, [[`SELECT ${x}`]]);
      #     ({ $queryRaw }: any, s) => $queryRaw.call(null, Object.assign([s], { raw: [s] }));
      #
      #   CE QUE LE MOTIF JUGE, ET POURQUOI IL A CHANGÉ (13e tour, revue `securite` sur `18936e6`).
      #   Il jugeait ce qui SUIT L'ACCOLADE FERMANTE (`=`, `:`, `)`, `,`) — c'est-à-dire un
      #   inventaire de contextes, et un inventaire s'oublie. Trois formes passaient, mesurées :
      #     const { c: { $queryRaw: q2 } } = { c: p };   fermante suivie de `}`
      #     for (const { $queryRaw: q2 } of [p])         fermante suivie de `of`
      #     const [{ $queryRaw: q2 }] = [p];             fermante suivie de `]`
      #
      #   Il juge maintenant ce qui suit LE NOM, et la distinction est structurelle et non
      #   contextuelle : une méthode DÉCLARÉE ou APPELÉE est suivie de `(` ou de `<` (générique) ;
      #   une LIAISON est suivie de `:`, `,`, `}` ou `=`. La déclaration de type dont le bac est
      #   plein (`declare const p: { $queryRaw(...): unknown };`) reste donc muette, et l'étiquette
      #   permise (`p.$queryRaw`…``) aussi — un accent grave n'est dans aucune des deux listes.
      #
      #   POURQUOI PAS LE NOM NU, SANS RIEN DERRIÈRE : le dépôt le cite EN PROSE une fois
      #   (`src/server/evenement/journal.ts:98`, « `$executeRaw`, pas `$queryRaw` : … »). L'accent
      #   grave qui ferme la citation le sauve — le même piège que la citation du client en prose,
      #   corrigé au tour précédent. Mesuré, pas supposé.
      - pattern-regex: |-
          \$(?:queryRaw|executeRaw|queryRawUnsafe|executeRawUnsafe)(?![\p{ID_Continue}$\x{200C}\x{200D}])(?:[\t\n\x0B\f\r\x{0085}\x{200B}\x{2028}\x{2029}\x{FEFF}\p{Zs}]|/\*(?:[^*]|\*(?!/))*\*/|//[^\n\r\x{2028}\x{2029}]*)*(?:[:,}]|=(?![=>]))
      # — LA FORGE D'UN `Sql` (même revue, témoins c04, c05, c10). Un `Sql` légitime naît d'une
      #   étiquette ; ces trois formes en fabriquent un, ou dénaturent un vrai, puis le passent à
      #   une étiquette permise — l'injection entre par l'INTERPOLATION, que la règle croyait sûre :
      #     (f.strings as string[])[0] = x;                          mutation d'un vrai
      #     Object.assign(Object.create(proto), { strings: [x] });   forge par le prototype
      #     Object.defineProperty(f, 'strings', { value: [x, ''] }); redéfinition
      #
      #   Deux bras, jugés par l'AST et non par le texte — donc insensibles aux commentaires, et
      #   c'est voulu après le piège de la prose : le MEMBRE `strings` et la CLÉ `strings` d'un
      #   littéral d'objet ; puis les quatre verbes de méta-programmation qui permettent de fabriquer
      #   ou de redéfinir un objet sans passer par son constructeur.
      #
      #   COÛT MESURÉ SUR LE `src/` RÉEL, et c'est pour cela que ce refus est tenable :
      #   `Object.create`, `Object.defineProperty`, `Object.defineProperties`,
      #   `Object.setPrototypeOf`, `Reflect.*`, `.strings` et `{ strings: }` — ZÉRO occurrence.
      #   `Object.assign` (0) et `Object.getPrototypeOf` (2) NE SONT PAS refusés : ils ne suffisent
      #   pas à forger sans les quatre verbes ci-dessus, et `Object.assign` est un utilitaire banal.
      #   Refuser large ce dont on n'a pas besoin, c'est préparer une exemption.
      #
      #   LIMITE DÉCLARÉE : `strings` est un mot commun. Le jour où un `strings` légitime apparaît
      #   sous `src/`, il prend une exemption NOMMÉE — et cette exemption est la trace.
      - pattern-either:
          - pattern: $X.strings
          - pattern: "{..., strings: $V, ...}"
          - pattern: Object.create(...)
          - pattern: Object.defineProperty(...)
          - pattern: Object.defineProperties(...)
          - pattern: Object.setPrototypeOf(...)
          - pattern: Reflect.$M(...)
          # — Le nom `strings` ÉCRIT EN CLAIR DANS UNE CHAÎNE (13e tour, revue `securite` sur
          #   `18936e6`). Les deux bras ci-dessus jugent le MEMBRE `f.strings` et la CLÉ nue
          #   `{ strings: … }` ; ils ne voyaient pas la chaîne, et quatre formes passaient :
          #     (f['strings'] as string[])[0] = e;
          #     Object.assign(f, Object.fromEntries([['strings', [e]]]));
          #     Object.assign({ __proto__: proto }, Object.fromEntries([['strings', [e]]]));
          #     Object.assign(f, JSON.parse(`{"strings": ["${e}", ""]}`));
          #   Rien n'y est CONSTRUIT : le nom est écrit tel quel, comme l'étaient déjà `"Prisma"` et
          #   `"constructor"` — ce précédent est la raison de ce bras, pas une analogie.
          #   `JSON.parse` n'est PAS refusé (9 occurrences dans `src/`) : la chaîne suffit, et
          #   refuser un verbe banal pour atteindre une chaîne, c'est payer le prix au mauvais
          #   endroit. COÛT MESURÉ sur le `src/` réel : `'strings'`, `"strings"` et le mot `strings`
          #   dans n'importe quelle chaîne — ZÉRO occurrence, commentaires compris.
          - pattern: '"strings"'
          #   ET LE MÊME NOM DANS UN GABARIT, jugé par le TEXTE (mesuré : le motif AST ci-dessus ne
          #   mord pas dans `` `{"strings": ["${x}", ""]}` `` — un gabarit interpolé n'est pas un
          #   littéral de chaîne pour l'AST, ses guillemets intérieurs sont du texte). C'est le seul
          #   endroit de ce bras où le texte est nécessaire, et il l'est pour une raison mesurée, pas
          #   par symétrie. Il exige le nom COLLÉ à ses guillemets, donc la prose française ne le
          #   déclenche pas (« les `strings` de … » n'a pas de guillemet contre le mot).
          - pattern-regex: |-
              ['"`]strings['"`]
          # — `__proto__` ÉCRIT EN CLAIR, clé ou chaîne (même revue, témoin c32) : le littéral
          #   `{ __proto__: … }` remplace `Object.create` sans le nommer. Refusé partout sous `src/`
          #   — 0 occurrence mesurée. Un dépôt qui n'en a jamais eu besoin n'a pas à en avoir le
          #   droit : la prochaine fois qu'il apparaît, c'est une exemption nommée qui le dit.
          - pattern-either:
              - pattern: "{..., __proto__: $V, ...}"
              - pattern: $X.__proto__
              - pattern: '"__proto__"'
      # — LES FONCTIONS D'ÉTIQUETTE hors de la position d'étiquette. Une étiquette est un appel
      #   pour l'AST de semgrep (mesuré : `Prisma.sql(...)` matche `Prisma.sql`…``) ; c'est
      #   donc la RÉFÉRENCE qui est jugée, et admise seulement DANS son propre gabarit étiqueté,
      #   générique compris (`p.$queryRaw<T>`…``). La même liste sert trois fois, par l'ancre
      #   `&hors-etiquette` : au niveau du fichier ; dans chaque interpolation d'un gabarit,
      #   parce que l'exclusion par portée y couvrirait une sortie nichée
      #   (`Prisma.sql`${Prisma.sql([x])}``) ; et dans l'OBJET d'une étiquette
      #   (`(q = p.$queryRaw, p).$queryRaw`…``).
      - patterns: &hors-etiquette
          - pattern-either:
              - pattern: $O.$queryRaw
              - pattern: $O.$executeRaw
              - pattern: $O["$queryRaw"]
              - pattern: $O["$executeRaw"]
              - pattern: $C.Prisma.sql
              - pattern: Prisma.sql
              - pattern: $C.Prisma["sql"]
              - pattern: Prisma["sql"]
          - pattern-not-inside: $O.$queryRaw`...`
          - pattern-not-inside: $O.$queryRaw<$T>`...`
          - pattern-not-inside: $O.$queryRaw<$T>
          - pattern-not-inside: $O.$executeRaw`...`
          - pattern-not-inside: $O.$executeRaw<$T>`...`
          - pattern-not-inside: $O.$executeRaw<$T>
          - pattern-not-inside: $O["$queryRaw"]`...`
          - pattern-not-inside: $O["$executeRaw"]`...`
          - pattern-not-inside: $C.Prisma.sql`...`
          - pattern-not-inside: Prisma.sql`...`
      - patterns:
          - pattern: $F`...${$A}...`
          - metavariable-pattern:
              metavariable: $A
              patterns: *hors-etiquette
      - patterns:
          - pattern-either:
              - pattern: $O.$queryRaw
              - pattern: $O.$executeRaw
              - pattern: $O["$queryRaw"]
              - pattern: $O["$executeRaw"]
          - metavariable-pattern:
              metavariable: $O
              patterns: *hors-etiquette
      # `sql` DÉSTRUCTURÉ de `Prisma`, court ou renommé (le motif renommé prend la forme courte,
      # mesuré) : même jugement, sous son nouveau nom. Second filet : la déstructuration de
      # `Prisma` est déjà refusée à sa source par la liste blanche.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  var { ..., sql: $S, ... } = $C.Prisma;
                  ...
              - pattern-inside: |
                  var { ..., sql: $S, ... } = Prisma;
                  ...
          - pattern-either:
              - patterns:
                  - pattern: $S
                  - pattern-not-inside: $S`...`
                  - pattern-not-inside: "var { ..., sql: $S, ... } = $E"
              - patterns:
                  - pattern: $F`...${$A}...`
                  - metavariable-pattern:
                      metavariable: $A
                      patterns:
                        - pattern: $S
                        - pattern-not-inside: $S`...`
      # — `Prisma.join` à UNE valeur : un second argument (séparateur, préfixe, suffixe) ou un
      #   appel étalé est refusé ; toute autre référence à la fonction aussi, jugée au niveau du
      #   fichier et dans l'argument d'un `join` admis (ancre `&join-hors-appel`).
      - pattern: $C.Prisma.join($V, $S, ...)
      - pattern: Prisma.join($V, $S, ...)
      - pattern: $C.Prisma.join(...$V)
      - pattern: Prisma.join(...$V)
      - patterns: &join-hors-appel
          - pattern-either:
              - pattern: $C.Prisma.join
              - pattern: Prisma.join
              - pattern: $C.Prisma["join"]
              - pattern: Prisma["join"]
          - pattern-not-inside: $C.Prisma.join($V)
          - pattern-not-inside: Prisma.join($V)
      - patterns:
          - pattern-either:
              - pattern: $C.Prisma.join($V)
              - pattern: Prisma.join($V)
          - metavariable-pattern:
              metavariable: $V
              patterns: *join-hors-appel
      # … et `join` DÉSTRUCTURÉ de `Prisma`, court ou renommé.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  var { ..., join: $J, ... } = $C.Prisma;
                  ...
              - pattern-inside: |
                  var { ..., join: $J, ... } = Prisma;
                  ...
          - pattern-either:
              - pattern: $J($V, $S, ...)
              - pattern: $J(...$V)
              - patterns:
                  - pattern: $J
                  - pattern-not-inside: $J($V)
                  - pattern-not-inside: "var { ..., join: $J, ... } = $E"
              - patterns:
                  - pattern: $J($V)
                  - metavariable-pattern:
                      metavariable: $V
                      patterns:
                        - pattern: $J
                        - pattern-not-inside: $J($W)
      # — le CONSTRUCTEUR d'une valeur : `Prisma.empty.constructor`, `Prisma.join(…)
      #   ['constructor']` rendent la classe `Sql`. Une méthode `constructor` DÉCLARÉE dans une
      #   classe n'est pas une lecture (mesuré).
      - pattern: $E.constructor
      - pattern: '"constructor"'
      # — Les membres dangereux du runtime (ou de tout module du client), par l'objet module :
      #   espace de noms, import par défaut, `require` affecté, `import()` attendu —
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import * as $X from "$M";
                  ...
              - pattern-inside: |
                  import $X from "$M";
                  ...
              - pattern-inside: |
                  var $X = require("$M");
                  ...
              - pattern-inside: |
                  var $X = await import("$M");
                  ...
          - pattern-either:
              - pattern: $X.$N
              - pattern: $X["$N"]
          - metavariable-regex: *specifieur-du-client
          - metavariable-regex: &membres-du-runtime
              metavariable: $N
              regex: ^(raw|Sql|sqltag|join|makeTypedQueryFactory)$
      # … et directement sur le chargeur (pointé ou calculé), ou importés / déstructurés par
      # leur nom.
      - patterns:
          - pattern-either:
              - pattern: require("$M").$N
              - pattern: require("$M")["$N"]
              - pattern: (await import("$M")).$N
              - pattern: (await import("$M"))["$N"]
              - pattern: 'var { ..., $N: $B, ... } = require("$M")'
              - pattern: 'var { ..., $N: $B, ... } = await import("$M")'
              - pattern: import { ..., $N, ... } from "$M"
          - metavariable-regex: *specifieur-du-client
          - metavariable-regex: *membres-du-runtime
