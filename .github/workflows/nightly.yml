# Nightly — la gate `gate-nightly` du registre (QA-T00, REQ-QA-013).
#
# CE QU'ELLE EST. Un rendez-vous quotidien pour les contrôles qui n'ont pas leur place dans une
# Gate A de PR : ceux qui sont LENTS, ceux qui touchent un TIERS, et ceux qui mesurent une DETTE
# plutôt qu'une régression. Un contrôle de dette rouge sur une PR bloque tout le monde pour un
# manque que la PR n'a pas créé ; ici, son rouge est un décompte, lu le matin.
#
# ⚠️ CE WORKFLOW EST ROUGE TANT QUE LA PHASE -1 N'EST PAS SORTIE, et c'est ce qu'on lui demande.
# `gates:prouvees --phase -1` refuse toute gate du socle sans script câblé, sans fixture et sans
# preuveRouge : au 2026-09-03 la plupart des gates du socle n'ont rien de tout cela. Le jour où ce
# job passe au vert, la phase -1 est sortie — c'est le seul endroit du dépôt qui le dise. Ne le
# passez PAS en `continue-on-error` pour le faire taire : un job qui ne bloque rien ne garde rien
# (RM-02), et `G-SEC-CI-BLOQUANTE` le refuse.
#
# CE QUI MANQUE ENCORE ICI. `docs/gates.json` décrit `gate-nightly` comme portant aussi : le
# contrat réel de l'API gouv (INT-T09), les heartbeats (QA-T19), la réconciliation quotidienne
# (INT-T08), le ZAP baseline (QA-T07 et QA-T19), l'audit de dépendances, le drill de restauration
# mensuel (QA-T12) et le drill de résilience trimestriel (QA-T27). Aucun de ces contrôles n'existe
# encore. Stryker complet (QA-T30) a le sien : le job `mutation`, plus bas. Chaque tâche citée ajoute SON job ici, au moment où elle
# livre son contrôle — pas avant, pour ne pas poser un job vide qui verdit sans rien mesurer.
# Est aussi à ouvrir : le REJEU des `fixtureRouge` (`scripts/gates/prove.sh <id>` : injecter la
# fixture, attendre un rouge). `gates:prouvees` vérifie qu'une fixture est NOMMÉE, jamais qu'elle
# rougit encore ; sans ce rejeu, une gate dont la cible a dérivé reste « armée » indéfiniment.
name: Nightly
on:
  schedule:
    # 03:17 UTC — hors des heures de fusion, et décalé de l'heure ronde où tout le monde planifie.
    - cron: "17 3 * * *"
  workflow_dispatch:
jobs:
  # GOV-160 (#319, 6077512137) : le decompte des gates prouvees et la fraicheur des lecons sont
  # ARCHIVES. Reste la protection de main, seule garde de ce job qui protege la fusion.
  depot:
    name: Visibilite du depot et protection de main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Sort en 2 (INDETERMINE) tant qu aucun jeton ne peut lire la protection de main.
      - name: Visibilite du depot et protection de main
        run: pnpm gov:depot-visibilite

  # INT-T09, REQ-QA-028 — le contrat de l API publique de recherche d entreprises, rejoue
  # contre l API REELLE : les memes saisies que les fixtures enregistrees, par la meme fabrique
  # d URL que la production. JOB SEPARE, pour la meme raison que `lecons-fraiches` : le job des
  # gates prouvees est rouge par construction tant que la phase -1 n est pas sortie. Ce job est
  # le seul endroit ou le depot appelle ce tiers ; il n est dans aucune Gate A, parce qu un tiers
  # en panne ne doit pas bloquer une PR. Son echec EST l alerte : une derive de forme se lit, puis
  # on reenregistre les fixtures — on n en retouche jamais une a la main (RM-03).
  contrat-api-gouv:
    name: Contrat nocturne — API recherche-entreprises
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # La preuve d abord : la garde des annees de naissance sait rougir, puis elle juge les
      # fixtures enregistrees — rejouees ici chaque nuit, et dans la Gate A par sa specification.
      - name: La garde aucun-annee-de-naissance sait rougir
        run: pnpm securite:annee-naissance:prove
      - name: Aucune annee de naissance ne traverse le mandataire
        run: pnpm securite:annee-naissance
      - name: Contrat de forme contre l API reelle
        run: pnpm integration:contrat-gouv

  # QA-T30, REQ-QA-002 — Stryker sur `src/domain/**`. JOB SEPARE, pour la meme raison que
  # `lecons-fraiches` : le job des gates est rouge par construction tant que la phase -1 n est pas
  # sortie. Ici et pas en porte A : une passe complete du domaine ne tient pas dans une PR.
  # Le seuil est DECLARE dans `stryker.config.json` (`thresholds.break`) et TENU : sous lui, la passe
  # sort en non nul, et chaque mutant non detecte est NOMME par `scripts/mutation/rapport.ts`.
  mutation:
    name: Mutation du domaine — seuil declare et tenu, survivants nommes
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # La preuve d abord : si le lecteur du rapport ne sait plus rougir, son verdict ne vaut rien.
      - name: Le lecteur du rapport de mutation sait rougir
        run: pnpm mutation:prove
      - name: Stryker sur src/domain, seuil declare dans stryker.config.json
        run: pnpm mutation

  # QA-T12 (REQ-QA-023) : une sauvegarde qu on ne restaure pas n en est pas une. Rouge si le dernier
  # exercice reussi est plus vieux que le seuil de la SSOT (`EXERCICE_DE_RESTAURATION_MAX_JOURS`),
  # s il a echoue, ou s il n y en a aucun. Secrets Cloudflare R2 absents : SAUTE, chaque absent nomme.
  sauvegarde-fraicheur:
    name: Sauvegarde — le dernier exercice de restauration est recent et reussi
    # Lentille securite (refus des PR 268 et 272) : les secrets vivent dans l ENVIRONNEMENT
    # `production`, jamais au niveau du depot ; un declenchement manuel ne part que de main.
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Fraicheur de l exercice de restauration
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: pnpm sauvegarde:fraicheur
      # Filet de nuit : un planificateur horaire qui ne tourne plus laisserait le clair vivre sans
      # qu'aucun run de `Sauvegarde` ne le nomme.
      - name: Aucun vidage ne reste en clair au-dela du seuil de la SSOT
        if: ${{ always() }}
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PARTNERS_SAUVEGARDE_ACTIVEE: ${{ vars.PARTNERS_SAUVEGARDE_ACTIVEE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: pnpm sauvegarde:clairs

  # QA-T13 (REQ-QA-034) : un runbook s exerce en preview, pas sur le papier. EN NUIT tant qu aucun
  # runbook du socle n a ete exerce — en porte A, il bloquerait toutes les PR jusqu au premier
  # exercice (decoupe arbitree par -d7 sur delegation de Williams du 2026-09-30) ; il passe en porte A
  # au premier exercice reel, et les trois runbooks du socle sont exerces avant la cloture de la
  # phase 0. Rouge ici : c est l etat attendu jusqu a l exercice, et il le NOMME.
  runbooks-exerces:
    name: Runbooks du socle — exerces en preview, corps inchanges depuis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: La garde des runbooks sait rougir
        run: pnpm runbooks:exerces:prove
      # QA-T56 : `--now` est FOURNI, en UTC. Avant MISE_EN_SERVICE, un runbook encore a exercer est
      # une condition de mise en service : avertissement nomme, sortie 0. La garde decide, pas le YAML.
      - name: Les runbooks du socle sont exerces en preview
        run: pnpm runbooks:exerces --now $(date -u +%F)
