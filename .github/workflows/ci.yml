      # la cle du verrou ; une action, donc avant toute commande.
      - name: Cache des moteurs de Prisma
        uses: actions/cache@v4
        with:
          path: ~/.cache/prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # GOV-142 : l instantane de la forge, lu UNE fois par le job `forge`, recu du run courant (ni
      # run-id ni jeton) et compare a l empreinte que ce job a publiee, avant tout usage.
      - name: Reception de l instantane de la forge
        uses: actions/download-artifact@v4
        with:
          name: forge-instantane
          path: ${{ runner.temp }}
      - name: Reception du blob de l eclat 1
        uses: actions/download-artifact@v4
        with:
          name: blob-1
          path: .vitest-reports
      - name: Reception du blob de l eclat 2
        uses: actions/download-artifact@v4
        with:
          name: blob-2
          path: .vitest-reports
      - run: pnpm install --frozen-lockfile
      # GOV-123, REQ-GOV-032. Les vues derivees ne sont plus commitees : elles se RENDENT ici,
      # avant toute etape qui en lit une, puis une seconde fois pour que deux rendus identiques
      # octet par octet soient exiges (la vue non reproductible est nommee). Aucun jeton : les
      # lectures de la forge de PLAN-STATE echouent de la meme facon aux deux rendus.
      - name: Les vues derivees sont rendues, et le rendu est reproductible
        run: pnpm vues:rendre
      - name: L instantane de la forge est celui que le job forge a publie
        run: pnpm ci:artefact:verifier
        env:
          ARTEFACT: ${{ runner.temp }}/forge-instantane.json
          EMPREINTE_ATTENDUE: ${{ needs.forge.outputs.empreinte_forge }}
      - name: Le blob de l eclat 1 est celui que son job a publie
        run: pnpm ci:artefact:verifier
        env:
          ARTEFACT: .vitest-reports/blob-1-2.json
          EMPREINTE_ATTENDUE: ${{ needs.tests-1.outputs.empreinte }}
      - name: Le blob de l eclat 2 est celui que son job a publie
        run: pnpm ci:artefact:verifier
        env:
          ARTEFACT: .vitest-reports/blob-2-2.json
          EMPREINTE_ATTENDUE: ${{ needs.tests-2.outputs.empreinte }}
      - name: Tests — fusion des eclats, aux seuils de la configuration
        run: pnpm test:fusion
      # QA-T03, REQ-QA-014. LA MEME garde que "Matrice de tracabilite" plus haut (`gov-trace.ts`),
      # relancee ICI avec les RESULTATS que `pnpm test` vient d ecrire (`test-results/vitest.json`) :
      # c est la seule passe qui sache qu un test est VERT, et pas seulement ecrit. Juste apres
      # "Tests", sans `if:` ni tolerance d echec : des resultats absents, illisibles ou partiels la
      # font rougir. L etape d avant les tests reste, pour le retour rapide. Le jeton sert la source
      # PR, facultative, comme plus haut.
      - name: req:check — chaque paire (tache, REQ) a son test annote et VERT
        run: pnpm req:check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOV_FORGE: ${{ runner.temp }}/forge-instantane.json
      # GOV-101, REQ-QA-002 — decision de Will du 2026-09-26 (W16, partners/ADR-0024) : la lentille
      # `mutation` n est plus une revue d agent, c est cette mesure. Stryker, en BAC A SABLE, sur les
      # seuls fichiers de `src/domain/`, `src/server/` et `src/lib/` que la PR ajoute ou modifie
      # (base de fusion
      # avec `origin/$GITHUB_BASE_REF`, que GitHub pose sur `pull_request`) ; sur `push` de main le
      # diff est vide, et l etape le dit et passe. Sous `thresholds.break` de `stryker.config.json`,
      # elle rougit et NOMME chaque survivant `fichier:ligne`. Les scripts de garde touches sont
      # nommes et ecartes : leur preuve de mutation est leur `--prove`, joue plus haut. Ici, dans
      # `gate-a`, et pas dans un job a part : seul `gate-a` est un check requis. Pas de
      # `continue-on-error`. La preuve du lecteur d abord : un verdict qui ne sait plus rougir ne vaut rien.
      - name: Le lecteur du rapport de mutation sait rougir
        run: pnpm mutation:prove
      - name: Mutation des fichiers de la PR — Stryker en bac a sable, survivants nommes
        run: pnpm mutation:pr
      # GOV-059, REQ-QA-013. `gov:etat` vient APRES toutes les etapes de mesure. Elle lit l etat
      # GLOBAL de la forge : un rouge venu d une AUTRE demande de fusion faisait « sauter » lint,
      # format, typecheck et tests, qui avaient l air d avoir mesure et n avaient rien mesure.
      # `gov:etat` LIT GitHub (PR ouvertes, labels de revendication, PR fusionnees). Sans jeton,
      # elle ECHOUE en nommant les cinq familles non evaluees — et c est voulu : une gate verte
      # parce qu elle n a pas pu lire est pire que pas de gate. Constate en CI le 2026-09-04,
      # premier run de cette etape : « gh: To use GitHub CLI in a GitHub Actions workflow, set the
      # GH_TOKEN environment variable ». La reponse n est PAS `--hors-ligne`, qui abandonnerait les
      # cinq familles en silence : c est de lui donner le jeton pour qu elle fasse son travail.
      - name: Etat vivant — fraicheur, verrou d owner, journal
        run: pnpm gov:etat --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOV_FORGE: ${{ runner.temp }}/forge-instantane.json
      - name: La garde de l etat vivant sait rougir
        run: pnpm gov:etat:prove
  poids:
    # GOV-142 : construire puis mesurer, seul dans son job : aucune garde ne voit `.next/`.
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.merged != true }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # La version de pnpm vient de `packageManager` dans package.json — une seule source.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      # GOV-142 : les moteurs de Prisma, que `pnpm install` telecharge (crochet postinstall), en cache par
      # la cle du verrou ; une action, donc avant toute commande.
      - name: Cache des moteurs de Prisma
        uses: actions/cache@v4
        with:
          path: ~/.cache/prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      # QA-T20 : construire puis mesurer, EN DERNIER. `next build` ecrit `.next/` et
      # `next-env.d.ts` ; pose plus haut, il faisait rougir `format:check` sur un fichier genere
      # (mesure en pre-vol le 2026-09-29). Aucune etape ne vient apres : aucune ne voit ces artefacts.
      - name: Construire l application pour la mesure
        run: pnpm perf:bundle:construire
      - name: Poids par route de l espace — JS propre et socle commun
        run: pnpm perf:bundle
  gate-a:
    # GOV-142 : LA PORTE FINALE, seul nom que la protection de branche exige. Un job dont elle
    # depend qui echoue la ferait SAUTER, et un « skipped » requis compte comme reussi : elle tourne
    # donc toujours (`always()`, avec la garde de fusion), et son etape exige `success` de CHAQUE
    # job de `needs`, liste lue dans `toJSON(needs)` et jamais recopiee.
    # ⚠️ LA SEULE CHOSE QUE CE JOB N'A RIEN A MESURER : une demande de fusion DEJA FUSIONNEE.
    # Le runbook fait cocher la huitieme case de la definition de termine APRES
    # `gh pr merge --delete-branch`. Cette edition du corps relance `pull_request: edited`, la tete
    # n'est plus une branche, et `gov:pr`, au premier tiers du job, echouait sur `git diff base...tete` :
    # toutes les etapes suivantes restaient en « skipped », dont Lint, Format, Typecheck, Tests, `req:check` et
    # `gov:etat`. Elles avaient l'air d'avoir mesure et n'avaient rien mesure. C'est la pathologie
    # que GOV-059 vient de fermer un cran plus bas, par l'ORDRE des etapes ; ici elle se produisait
    # A CHAQUE demande de fusion, par construction. Un bruit qu'on apprend a ignorer finit par
    # cacher un vrai rouge.
    #
    # LA CONDITION EST LA PLUS ETROITE QUI FERME CE CAS, et pas une de plus :
    #   — elle ne regarde PAS `github.event.action` : ecarter `edited` tuerait la raison d'etre du
    #     declencheur, juste au-dessus (corriger un titre refuse par `gov:pr` doit relancer la
    #     mesure, PR 26) ;
    #   — elle ne regarde PAS `github.event_name` : sur `push`, `github.event.pull_request` est
    #     absent, la propriete rend `null`, et GitHub compare en NOMBRES des operandes de types
    #     differents (`null` -> 0, `true` -> 1). `null != true` est donc VRAI et la porte A tourne
    #     sur main comme avant. Ajouter `github.event_name != 'pull_request' ||` n'ecarterait pas un
    #     run de plus : ce serait une seconde ecriture de la meme regle, donc une divergence a venir
    #     (RM-01) ;
    #   — une demande de fusion OUVERTE dont on edite le corps porte `merged: false` : elle reste
    #     mesuree, et c'est exige par le temoin.
    # Le seul run ecarte est celui dont il n'y a plus rien a lire. Le diff FUSIONNE, lui, n'est pas
    # perdu : il change de porte, et se mesure au run `push: main` du meme sha.
    #
    # Ce `if:` est au JOB, pas aux etapes : un job saute se lit « skipped » sans aucun rouge, alors
    # que des dizaines d'etapes sautees une par une afficheraient exactement l'image qu'on retire d'ici.
    #
    # TEMOIN : `tests/unit/gouvernance/revendication-par-branche.spec.ts`, qui EVALUE cette
    # expression contre cinq contextes d'evenement au lieu d'en chercher le texte, et qui exige la
    # meme garde de TOUT job de TOUT workflow declenche par `pull_request` — en suivant `needs:`,
    # pour qu'un job neuf qui reprendrait ces etapes ne puisse pas s'y soustraire en silence.
    # EXPLICITES, et ce n'est pas de la ceinture-bretelles. `gov:entite:corps` est BLOQUANTE et
    # rend 2 (donc echoue) quand elle ne peut pas lire. Le defaut de `GITHUB_TOKEN` se configure
    # au niveau du depot ou de l'organisation : le jour ou quelqu'un le passe en restreint, la
    # garde deviendrait INSATISFIABLE — exactement ce qu'on apprend a sauter. Nommer le droit
    # ici, c'est le soustraire a un reglage qu'on ne relit jamais.
    runs-on: ubuntu-latest
    needs: [forge, gardes, porte-d, tests-1, tests-2, apres-tests, poids]
    if: ${{ always() && github.event.pull_request.merged != true }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # La version de pnpm vient de `packageManager` dans package.json — une seule source.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      # GOV-142 : les moteurs de Prisma, que `pnpm install` telecharge (crochet postinstall), en cache par
      # la cle du verrou ; une action, donc avant toute commande.
      - name: Cache des moteurs de Prisma
        uses: actions/cache@v4
        with:
          path: ~/.cache/prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Chaque job de la porte A a reussi
        run: pnpm ci:porte-finale
        env:
          RESULTATS: ${{ toJSON(needs) }}
