# Porte A — GOV-160, décision de Williams du 2026-10-09 (#319, commentaire 6077512137) :
# « environ 15 gardes », tenues sur l'ARGENT, les DONNÉES PERSONNELLES et la SÉCURITÉ.
# Les autres gardes sont ARCHIVÉES : retirées d'ici, marquées `archivee` dans `docs/gates.json`,
# leur code et leurs specs conservés (specs sous `tests/archive/`, hors de la suite).
# Ajouter une garde ici, c'est l'inscrire `gardee` dans `docs/gates.json` dans le même diff.
# Aucune étape ne porte `continue-on-error` : une garde qui ne bloque rien ne garde rien.
name: Gate A
on:
  push: { branches: [main] }
  # `gov:pr` juge le titre et le corps : corriger un titre doit relancer la mesure.
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
permissions:
  contents: read
# Un run à la fois par PR ; main n'est jamais annulé.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gardes:
    # Les gardes statiques : rapides, sans base ni navigateur.
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.merged != true }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # La version de pnpm vient de `packageManager` dans package.json — une seule source.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Cache des moteurs de Prisma
        uses: actions/cache@v4
        with:
          path: ~/.cache/prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      # 1-2. Typage, lint, format.
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      # 6. La garde de PR à trois niveaux (critique, normal, léger).
      - name: gov:pr — titre, niveau de la PR, bloc ROUGE/VERT si critique
        run: pnpm gov:pr
      - name: La garde de PR sait rougir
        run: pnpm gov:pr:prove
      # 7. Le dépôt est public.
      - name: Regle de publication (depot public)
        run: pnpm gov:publication
      - name: La garde de publication sait rougir
        run: pnpm gov:publication:prove
      - name: Le corps PUBLIE de la PR ne porte aucune coordonnee
        if: github.event_name == 'pull_request'
        run: pnpm gov:entite:corps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: La garde du corps publie sait rougir
        run: pnpm gov:entite:corps:prove
      # 8. Secrets et matrice d'autonomie des agents.
      - name: Matrice d autonomie des agents et garde des secrets
        run: pnpm gov:autonomie
      - name: La garde d autonomie sait rougir
        run: pnpm gov:autonomie:prove
      # 9. Argent : centimes, seuils à source unique, contrat d'intégration.
      - name: Centimes — aucun flottant, montants en Cents
        run: pnpm partners:schema:cents
      - name: La garde des centimes sait rougir
        run: pnpm partners:schema:cents:prove
      - name: Seuils et delais — une seule source, aucun litteral hors SSOT
        run: pnpm ssot:seuils
      - name: La garde des seuils sait rougir
        run: pnpm ssot:seuils:prove
      - name: Contrat d integration — derive, et son empreinte le tient
        run: pnpm contracts:hash
      # 10. Vocabulaire : enums et glossaire, pour les seuls termes visibles des apporteurs.
      - name: Vocabulaire — enums, termes des apporteurs et etats occupants
        run: pnpm partners:schema:enums
      - name: La garde du vocabulaire sait rougir
        run: pnpm partners:schema:enums:prove
      # 11. Migrations additives.
      - name: Migrations additives
        run: pnpm partners:migrations:additive
      - name: La garde des migrations sait rougir
        run: pnpm partners:migrations:additive:prove
      # 12-13. Journal immuable et données personnelles.
      - name: Journal sans donnee personnelle
        run: pnpm journal:sans-pii
      - name: La garde du journal sait rougir
        run: pnpm journal:sans-pii:prove
      - name: Donnees personnelles chiffrees, schema et chemins d ecriture
        run: pnpm securite:schema-pii
      - name: La garde des donnees personnelles sait rougir
        run: pnpm securite:schema-pii:prove
      # 14. Autorisation, cloisonnement, débit, en-têtes, adaptateur MCP.
      - name: Roles de la console — requireRole partout, droits dans la matrice
        run: pnpm securite:roles
      - name: La garde des roles sait rougir
        run: pnpm securite:roles:prove
      - name: Compteurs de debit — famille close
        run: pnpm securite:rate-famille
      - name: La garde des compteurs de debit sait rougir
        run: pnpm securite:rate-famille:prove
      - name: Securite — aucun style en ligne sous src/app
        run: pnpm csp:inline
      - name: La garde des styles en ligne sait rougir
        run: pnpm csp:inline:prove
      - name: Harnais de l adaptateur MCP
        run: pnpm harnais-mcp
      # 15. Analyse statique de sécurité et dépendances.
      - name: Semgrep — regles maison et jeux publics sur src
        run: pnpm sec:semgrep
      - name: Semgrep — chaque regle maison mord sur son temoin
        run: pnpm sec:semgrep:prove
      - name: Dependances de production — aucun avis haut ou critique
        run: pnpm securite:audit

  porte-d:
    # 11 (suite) et 5 : la PR confrontée à sa base dans l'historique.
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.merged != true }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Cache des moteurs de Prisma
        uses: actions/cache@v4
        with:
          path: ~/.cache/prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: La porte D sait rougir — une colonne encore lue, supprimee, est nommee
        run: pnpm gate-d:prove
      - name: Porte D — expand/contract, base vierge, vidage N-1 seme, diff vide, image N-1
        run: pnpm gate-d
      - name: red-first — les tests nouveaux de la PR rougissent contre sa base
        if: github.event_name == 'pull_request'
        run: pnpm red-first
      - name: La garde red-first sait rougir
        run: pnpm red-first:prove

  tests-1:
    # 3. La suite (unitaires et intégration, base réelle), en deux éclats identiques hormis `ECLAT`.
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.merged != true }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Cache des moteurs de Prisma
        uses: actions/cache@v4
        with:
          path: ~/.cache/prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Tests — un eclat de la suite
        run: pnpm test:eclat
        env:
          ECLAT: 1/2
      - name: Depot du blob de l eclat
        uses: actions/upload-artifact@v4
        with:
          name: blob-1
          path: .vitest-reports/blob-1-2.json
          overwrite: false
          if-no-files-found: error
          retention-days: 1
  tests-2:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.merged != true }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Cache des moteurs de Prisma
        uses: actions/cache@v4
        with:
          path: ~/.cache/prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Tests — un eclat de la suite
        run: pnpm test:eclat
        env:
          ECLAT: 2/2
      - name: Depot du blob de l eclat
        uses: actions/upload-artifact@v4
        with:
          name: blob-2
          path: .vitest-reports/blob-2-2.json
          overwrite: false
          if-no-files-found: error
          retention-days: 1

  apres-tests:
    # 3 (couverture : 100 % sur src/domain) et 4 (mutation des fichiers de la PR).
    runs-on: ubuntu-latest
    needs: [tests-1, tests-2]
    if: ${{ github.event.pull_request.merged != true }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Cache des moteurs de Prisma
        uses: actions/cache@v4
        with:
          path: ~/.cache/prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Reception du blob de l eclat 1
        uses: actions/download-artifact@v4
        with:
          name: blob-1
          path: .vitest-reports
      - name: Reception du blob de l eclat 2
        uses: actions/download-artifact@v4
        with:
          name: blob-2
          path: .vitest-reports
      - run: pnpm install --frozen-lockfile
      - name: Tests — fusion des eclats, aux seuils de la configuration
        run: pnpm test:fusion
      - name: Le lecteur du rapport de mutation sait rougir
        run: pnpm mutation:prove
      - name: Mutation des fichiers de la PR — Stryker en bac a sable, survivants nommes
        run: pnpm mutation:pr

  gate-a:
    # LA PORTE FINALE, seul check requis par la protection de main. Elle tourne toujours
    # (`always()`) et exige `success` de chaque job de `needs`, lu dans `toJSON(needs)`.
    runs-on: ubuntu-latest
    needs: [gardes, porte-d, tests-1, tests-2, apres-tests]
    if: ${{ always() && github.event.pull_request.merged != true }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Chaque job de la porte A a reussi
        run: pnpm ci:porte-finale
        env:
          RESULTATS: ${{ toJSON(needs) }}
