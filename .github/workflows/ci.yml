# CI minimale. Le compte des gardes armées n'est PAS recopié ici : il se lit dans
# `docs/GATES.md`, vue dérivée de `docs/gates.json` par `pnpm gov:gates-derivees --render`.
# Une garde entre dans ce fichier par sa tâche, chacune APRÈS avoir été vue rougir.
#
# ⚠️ `pnpm gates:prouvees --phase -1` n'est PAS ici, et ce n'est pas un oubli : la plupart des
# gates du socle n'ont ni script ni preuve, la commande est donc ROUGE aujourd'hui et rendrait
# la CI définitivement rouge — une CI toujours rouge ne garde plus rien. Elle tourne en nightly,
# où son rouge est le décompte de ce qui reste à armer, pas le refus d'une PR. Ce qui entre ici,
# c'est `gates:prouvees:prove` : la preuve ne dépend d'aucun état du dépôt, elle doit rester verte.
# Chaque garde est suivie de SA PREUVE : une garde dont on ne vérifie pas qu'elle sait rougir
# cesse un jour de garder sans que rien ne le signale.
name: Gate A
on:
  push: { branches: [main] }
  # `gov:pr` juge le TITRE et les LABELS de la PR. Sans `types`, GitHub ne declenche que sur
  # opened/synchronize/reopened : corriger un titre refuse par la garde ne relancait donc RIEN,
  # et un `gh run rerun` rejoue l'evenement d'ORIGINE, donc l'ancien titre. Constate sur la PR 26.
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
jobs:
  gate-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # La version de pnpm vient de `packageManager` dans package.json — une seule source.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Regle de publication (depot public)
        run: pnpm gov:publication
      - name: La garde de publication sait rougir
        run: pnpm gov:publication:prove
      - name: Identifiants qualifies
        run: pnpm gov:identifiants
      - name: La garde des identifiants sait rougir
        run: pnpm gov:identifiants:prove
      - name: Coherence du backlog
        run: pnpm gov:tasks
      - name: La garde du backlog sait rougir
        run: pnpm gov:tasks:prove
      # GOV-024, REQ-GOV-032. La vue n'est pas seulement REGENERABLE, elle est COMPAREE.
      # `docs/TASKS.md` avait un generateur et aucun verificateur : la derive etait silencieuse.
      # Le mode n'ecrit rien — une garde qui repare ce qu'elle controle est toujours verte.
      - name: La vue du backlog est egale a sa source
        run: pnpm gov:tasks:verifie-rendu
      - name: Registre des exigences
        run: pnpm gov:requirements
      - name: La garde du registre sait rougir
        run: pnpm gov:requirements:prove
      # GOV-024, REQ-GOV-032. `docs/REQUIREMENTS.md` n'avait AUCUN generateur, alors que son
      # bandeau affirmait le contraire — et il avait derive : 353 exigences annoncees pour 354.
      - name: La vue des exigences est egale a sa source
        run: pnpm gov:requirements:verifie-rendu
      - name: Registre des decisions
        run: pnpm gov:hypotheses
      - name: La garde des decisions sait rougir
        run: pnpm gov:hypotheses:prove
      - name: Table de preseance
        run: pnpm gov:preseance
      - name: La garde de preseance sait rougir
        run: pnpm gov:preseance:prove
      - name: Affirmations verifiees sur axionia
        run: pnpm gov:sonde
      - name: La sonde sait rougir
        run: pnpm gov:sonde:prove
      - name: ADR — index derive et gabarit
        run: pnpm gov:adr
      - name: La garde des ADR sait rougir
        run: pnpm gov:adr:prove
      - name: Matrice d autonomie des agents et garde des pushes
        run: pnpm gov:autonomie
      - name: La garde d autonomie sait rougir
        run: pnpm gov:autonomie:prove
      - name: Gabarit de PR, CODEOWNERS et charte des agents
        run: pnpm gov:pr
      - name: Inventaire prouve — tout etat >= code porte une preuve
        run: pnpm gov:inventaire
      - name: La garde de l inventaire sait rougir
        run: pnpm gov:inventaire:prove
      - name: Fiches de role derivees de docs/agents.json
        run: pnpm gov:agents
      - name: La garde des fiches sait rougir
        run: pnpm gov:agents:prove
      - name: Les fiches sur le disque sont egales a leur source
        run: pnpm gov:agents:verifier
      # Registre d entite : deux sens en une garde. Elle refuse la mise en service tant qu un
      # champ vaut la sentinelle, et elle refuse tout autant qu une coordonnee bancaire reelle
      # soit commitee — le depot est PUBLIC, ce qui y entre reste lisible pour toujours. Elle
      # n empeche ni le build ni les tests : les phases 0 a 3 se codent contre la sentinelle.
      - name: Registre d entite — sentinelle tenue dans les deux sens
        run: pnpm gov:entite
      - name: La garde du registre d entite sait rougir
        run: pnpm gov:entite:prove

      # Seule la PREUVE entre ici : le mode en ligne lit la forge et rend 2 quand il ne peut
      # pas lire, ce qui ferait clignoter une etape de Gate A. Et l'historique d'edition d'une
      # PR est IMMUABLE : cable en bloquant, il rendrait la PR 31 infusionnable a jamais.
      - name: La garde du corps publie de la PR sait rougir
        run: pnpm gov:entite:corps:prove
      # Seule la PREUVE entre ici : le mode en ligne rend 2 sous le jeton d Actions, qui ne
      # lit pas la protection de branche. Le mode en ligne tourne en nightly.
      - name: La garde du depot sait rougir
        run: pnpm gov:depot-visibilite:prove
      # Les 16 ruptures que cette garde a trouvees le 2026-09-04 sont CORRIGEES : elle est verte,
      # donc bloquante. La cause racine des 13 premieres etait `gardes.spec.ts`, douze promesses
      # de couverture et zero annotation `@req`.
      - name: Matrice de tracabilite REQ vers tache vers test vers PR
        run: pnpm gov:trace
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: La matrice de tracabilite sait rougir
        run: pnpm gov:trace:prove
      - name: La vue de tracabilite est derivee de ses sources
        run: pnpm gov:trace:verifier
      # `gov:etat` LIT GitHub (PR ouvertes, labels de revendication, PR fusionnees). Sans jeton,
      # elle ECHOUE en nommant les cinq familles non evaluees — et c est voulu : une gate verte
      # parce qu elle n a pas pu lire est pire que pas de gate. Constate en CI le 2026-09-04,
      # premier run de cette etape : « gh: To use GitHub CLI in a GitHub Actions workflow, set the
      # GH_TOKEN environment variable ». La reponse n est PAS `--hors-ligne`, qui abandonnerait les
      # cinq familles en silence : c est de lui donner le jeton pour qu elle fasse son travail.
      - name: Etat vivant — fraicheur, verrou d owner, journal
        run: pnpm gov:etat --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: La garde de l etat vivant sait rougir
        run: pnpm gov:etat:prove
      - name: contracts:hash — le contrat est derive, et son empreinte le tient
        run: pnpm contracts:hash
      - name: La garde de PR sait rougir
        run: pnpm gov:pr:prove
      - name: Vue GATES.md derivee du registre
        run: pnpm gov:gates-derivees
      - name: Le decompte des gardes sait rougir
        run: pnpm gates:prouvees:prove
      - name: Les paths derives sont a jour
        run: pnpm lot:paths:check
      # GOV-006 : le glossaire etait une consigne, pas un controle. Ces deux etapes sont ce qui
      # le rend opposable — la constante ETATS_OCCUPANTS confrontee a REQ-DM-003, chaque valeur
      # d enum confrontee au glossaire.
      - name: Vocabulaire — enums, glossaire et etats occupants
        run: pnpm partners:schema:enums
      - name: La garde du vocabulaire sait rougir
        run: pnpm partners:schema:enums:prove
      # GOV-013 : le lexique interdit (REQ-GOV-017, durci par REQ-JUR-037). La garde vise la
      # TOURNURE et non le mot — « aucun objectif, aucun quota » est la phrase qui protege du
      # la charte relationnelle, et une garde qui la ferait rougir forcerait a la RETIRER. La preuve
      # suit tient les deux sens : un temoin par famille, huit positions limites, et des
      # contre-temoins verts, dont la phrase de l'ADR « valeurs du monde réel » verbatim.
      - name: Lexique interdit — aucun usage prescriptif dans le perimetre de REQ-GOV-017
        run: pnpm gov:lexique
      - name: La garde du lexique sait rougir, et laisse passer la negation qui protege
        run: pnpm gov:lexique:prove
      - name: Typecheck
        run: pnpm typecheck
      # `pnpm test` a besoin du jeton pour la MEME raison que l etape `gov:etat` ci-dessus :
      # `plan-state-frais.spec.ts` et `une-tache-un-owner.spec.ts` lancent la garde contre le depot
      # REEL, et elle echoue quand elle ne peut pas lire la forge — c est ce qu on lui demande.
      # Sans le jeton ici, la suite rougissait sur deux tests qui ne disaient rien du code.
      - name: Tests
        run: pnpm test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
