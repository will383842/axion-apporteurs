# L'image d'Axion Partners, construite par la forge — QA-T05 (REQ-QA-018, REQ-QA-032).
#
# La forge CONSTRUIT l'image, la JUGE (porte C), puis la PUBLIE sur son registre de conteneurs,
# étiquetée `latest` et `sha-<7>`. La plateforme de déploiement ne fera plus que la tirer : elle
# ne construit rien. Le tirage lui-même, et la vérification de l'atterrissage (l'en-tête de build
# servi porte le sha fusionné), sont le job `deployer` (QA-T34, REQ-QA-033), plus bas.
#
# Chaque étape est un script de `package.json`, sous la forme fermée que les gardes exigent : la
# logique vit dans `scripts/image/` et `scripts/gates/gate-c.sh`, jamais en ligne ici.
#
# DEUX JOBS, ET C'EST LA SÉCURITÉ QUI LE VEUT (refus de la lentille `securite` sur la PR #221) :
#   — `image` tourne sur les demandes de fusion ET sur `main` : il ne porte QUE `contents: read`. Le
#     code d'une demande de fusion (scripts, Dockerfile) s'y exécute ; un jeton capable de publier
#     y serait à sa portée, et `checkout` le persisterait dans `.git/config` ;
#   — `publier` ne tourne QUE sur un `push` vers `main`, APRÈS `image`, et il est le SEUL à porter
#     `packages: write`. Il reconstruit l'image et rejoue la porte C avant de pousser : l'image
#     publiée est celle qui vient d'être prouvée, dans le même job.
#   Chaque `checkout` pose `persist-credentials: false`.
#
# CE QUE `image` PROUVE, DANS CET ORDRE :
#   1. `image:construire` — l'image se construit SANS AUCUNE variable de base ni de cache : aucun
#      `--build-arg`, et le Dockerfile n'en pose pas. C'est une divergence ASSUMÉE d'avec l'autre
#      dépôt, qui substitue une adresse factice au build ; elle est écrite ici pour ne pas être
#      réintroduite par imitation (REQ-QA-032) ;
#   2. `image:temoin-build-sans-base` — la face ROUGE du même point : une page qui interroge la base
#      au rendu fait échouer le build, et l'échec NOMME la page ;
#   3. `gate-c` — la porte C, face VERTE : l'image démarre avec une base et un cache éphémères,
#      `readyz` rend 200, zéro migration en attente, en moins de trois minutes ;
#   4. `gate-c:prove` — la porte C, face ROUGE : la même image, une migration cassée en plus, fait
#      sortir la porte en code non nul avec le compte des migrations en attente.
#
# `cancel-in-progress: false` : une publication commencée n'est jamais tuée par la suivante — une
# image à moitié poussée sur `latest` serait pire qu'une image en retard.
name: Image

on:
  pull_request:
  # GOV-160 (#319, 6077512137) : plus declenche sur push de main. La production n est pas demarree
  # (secrets absents) et le job deployer y echouait 111 fois sur 131. Les jobs publier, deployer et
  # alerter restent ecrits, gardes par `push` : ils se rearment en remettant ce declencheur.

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    # Même garde que la porte A : une demande de fusion DÉJÀ fusionnée n'a plus rien à mesurer, et
    # le diff fusionné se mesure au run `push: main` du même sha.
    if: ${{ github.event.pull_request.merged != true }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      # La version de pnpm vient de `packageManager` dans package.json — une seule source.
      - uses: pnpm/action-setup@v4

      - name: L image se construit sans aucune variable de base ni de cache
        run: pnpm image:construire

      - name: Le build sans base sait rougir — une page qui lit la base au rendu est nommee
        run: pnpm image:temoin-build-sans-base

      - name: Porte C — l image demarre, readyz 200, zero migration en attente, en moins de 3 min
        run: pnpm gate-c

      - name: La porte C sait rougir — une migration cassee sort en non nul, avec le compte
        run: pnpm gate-c:prove

      # QA-T06 (lentille securite, PR 281) : l image de la PR est exportee en ARTEFACT ici, dans ce job
      # en LECTURE SEULE. Le job qui la publie dans le paquet de preview (preview.yml) n execute jamais
      # de code de la PR : il charge ce fichier comme une donnee.
      - name: Exporter l image de la PR pour la preview
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm image:exporter
      - if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: image-preview
          path: image-preview.tar
          retention-days: 2

  publier:
    runs-on: ubuntu-latest
    needs: image
    # Sur `main` seulement : jamais sur une demande de fusion, dont le code s'exécuterait ici.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4

      - name: L image publiee est reconstruite ici
        run: pnpm image:construire

      - name: Et prouvee ici, par la porte C, avant d etre poussee
        run: pnpm gate-c

      - name: Publier sur le registre — latest et sha-7
        env:
          JETON: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm image:publier

  # QA-T34 (REQ-QA-033) — LA PLATEFORME TIRE `sha-<7>`, UN SEUL PRODUCTEUR À LA FOIS.
  #
  #   — après `publier`, sur un `push` vers `main` seulement : l'image tirée est celle qui vient
  #     d'être prouvée et poussée par ce même run ;
  #   — `concurrency` PAR ENVIRONNEMENT, au niveau du job (jamais du workflow, RM-09), et
  #     `cancel-in-progress: false` : un déploiement commencé n'est jamais tué par le suivant, qui
  #     attend son tour ;
  #   — `contents: read` seul : ce job ne pousse rien, ni image ni code ;
  #   — les secrets arrivent par l'environnement de l'étape, jamais en argument ; absents, le
  #     déploiement est SAUTÉ et chaque secret manquant est nommé en `::warning::` (arbitrage -d7 sur
  #     délégation de Williams du 2026-09-29) ; présents, tout échec est rouge, y compris une image
  #     jamais servie : `deploy:coolify` lit `x-partners-build-sha` jusqu'à ce qu'il vaille le sha.
  deployer:
    runs-on: ubuntu-latest
    needs: publier
    # Les secrets de la plateforme vivent dans l'ENVIRONNEMENT `production`, jamais au niveau du dépôt :
    # un secret de dépôt est servi à tout workflow d'une PR de branche, avant relecture. La règle de
    # branche de l'environnement (« main seulement », réglage de la forge) est la vraie serrure.
    environment: production
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    concurrency:
      group: deploiement-production
      cancel-in-progress: false
    # QA-T67 : EXACTEMENT deux lectures. actions lit les runs de ci.yml (push de main, meme sha) et
    # les jobs du run retenu ; aucun check-run n est lu, checks n a plus d usage (lentille securite
    # du 2026-10-02). Aucune ecriture.
    permissions:
      contents: read
      actions: read
    # QA-T54 : le sha servi, deja mis en forme par le script (hexadecimal, illisible, ou vide),
    # passe au job alerter. Aucun secret de canal ici : deployer n en lit que trois.
    outputs:
      sha_servi: ${{ steps.atterrissage.outputs.sha_servi }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile

      # QA-T67 (REQ-GOV-014) — la porte A du MEME sha, avant tout le reste : le plus recent run de
      # ci.yml sur push de main (run_number, puis run_attempt), reussi, dont le job gate-a est
      # reussi. Absente, en cours au-dela de la borne, rouge, un run hors filtre ou sans gate-a :
      # refus nomme. Le jeton est servi a CETTE etape seule, jamais au job, ni a l AIPD, ni a la
      # plateforme.
      - name: Le deploiement attend la porte A du meme sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm deploy:attendre-porte-a

      # JUR-T35 (REQ-CPL-009) — aucun depot reel sans l AIPD signee : a partir de MISE_EN_SERVICE, l etat
      # « signee le <date> par <signataire> » de docs/rgpd/aipd.md et la variable AIPD_SIGNEE_LE de
      # l environnement production (vars, posee par Williams seul) doivent dire le meme jour ; sinon le
      # deploiement s arrete ici, avant la plateforme. Aucun secret dans cette etape.
      - name: Aucun depot reel sans l AIPD signee
        env:
          AIPD_SIGNEE_LE: ${{ vars.AIPD_SIGNEE_LE }}
        run: pnpm aipd:signee

      - name: La plateforme tire sha-7, puis l atterrissage est lu sur l en-tete servi
        id: atterrissage
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          PARTNERS_URL_PUBLIQUE: ${{ vars.PARTNERS_URL_PUBLIQUE }}
        run: pnpm deploy:coolify

  # QA-T54 (REQ-GOV-014) — L ALERTE D UN DEPLOIEMENT QUI N ATTERRIT PAS. Option B de la lentille
  # securite, validee par la coordination : un job A PART, pour que l alerte survive a un deployer
  # qui plante, depasse son delai ou est annule, et pour que seul ce job lise le canal.
  #   — needs: deployer et if: failure() || cancelled() : il ne tourne que si deployer n a pas reussi ;
  #   — les deux secrets du canal dans l env de l ETAPE, jamais du job, et rien d autre ;
  #   — le sha attendu est celui du commit, le sha servi vient de la sortie de deployer, absente si
  #     deployer est mort avant de l ecrire : l alerte part quand meme, avec « inconnu ».
  alerter:
    runs-on: ubuntu-latest
    needs: deployer
    environment: production
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (failure() || cancelled()) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile

      - name: Un deploiement non atterri alerte, sans donnee personnelle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHA_ATTENDU: ${{ github.sha }}
          SHA_SERVI: ${{ needs.deployer.outputs.sha_servi }}
          DEPLOIEMENT_ENVIRONNEMENT: production
        run: pnpm deploy:alerter
