# Provisionnement de Partners sur la plateforme — QA-T50 (REQ-INT-031).
#
# À LA MAIN SEULEMENT (`workflow_dispatch`) : il crée des ressources et y pose des secrets, rien ne
# doit le lancer par effet de bord d'une fusion ou d'une demande de fusion.
#
#   — `contents: read` seul : ce job ne pousse rien ;
#   — chaque secret applicatif vient du secret du dépôt de MÊME nom (`src/lib/env.ts` en est la
#     source, le test la confronte à cette liste), par l'environnement de l'étape, jamais en
#     argument ; la configuration facultative vient des variables du dépôt ;
#   — `DATABASE_URL` et `REDIS_URL` ne sont PAS ici : elles viennent des bases que le script crée ;
#   — un secret absent : le provisionnement ÉCHOUE et chaque absent est nommé en `::error::`
#     (arbitrage -d7 du 2026-09-30 : un geste manuel ne rend jamais un vert vide).
#
# La logique vit dans `scripts/deploiement/provisionner.ts` ; aucune valeur n'y est imprimée.
name: Provisionnement Coolify

on:
  workflow_dispatch:

jobs:
  provisionner:
    runs-on: ubuntu-latest
    # Lentille securite, refus de la PR 272 : les secrets vivent dans l ENVIRONNEMENT `production`,
    # jamais au niveau du depot (un secret de depot est servi a toute PR de branche, avant relecture),
    # et le declenchement manuel ne part que de la branche principale.
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: production
    concurrency:
      group: provisionnement-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile

      - name: Base, cache et application crees s ils manquent, puis variables posees depuis les secrets
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          PARTNERS_DB_EXECUTION_SECRET: ${{ secrets.PARTNERS_DB_EXECUTION_SECRET }}
          COOLIFY_SERVER_UUID: ${{ vars.COOLIFY_SERVER_UUID }}
          PARTNERS_URL_PUBLIQUE: ${{ vars.PARTNERS_URL_PUBLIQUE }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          MAGIC_LINK_SECRET: ${{ secrets.MAGIC_LINK_SECRET }}
          DEPOSIT_TOKEN_SECRET: ${{ secrets.DEPOSIT_TOKEN_SECRET }}
          AXIONIA_WEBHOOK_SECRET: ${{ secrets.AXIONIA_WEBHOOK_SECRET }}
          AXIONIA_API_TOKEN: ${{ secrets.AXIONIA_API_TOKEN }}
          # Double cle de rotation (REQ-QA-030) : facultative, posee seulement si presente.
          AXIONIA_WEBHOOK_SECRET_PRECEDENT: ${{ secrets.AXIONIA_WEBHOOK_SECRET_PRECEDENT }}
          AXIONIA_WEBHOOK_SECRET_PRECEDENT_ECHEANCE: ${{ secrets.AXIONIA_WEBHOOK_SECRET_PRECEDENT_ECHEANCE }}
          AXIONIA_API_TOKEN_PRECEDENT: ${{ secrets.AXIONIA_API_TOKEN_PRECEDENT }}
          AXIONIA_API_TOKEN_PRECEDENT_ECHEANCE: ${{ secrets.AXIONIA_API_TOKEN_PRECEDENT_ECHEANCE }}
          DOCUSEAL_WEBHOOK_SECRET: ${{ secrets.DOCUSEAL_WEBHOOK_SECRET }}
          PII_ENCRYPTION_KEY: ${{ secrets.PII_ENCRYPTION_KEY }}
          IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}
          PII_HASH_KEY: ${{ secrets.PII_HASH_KEY }}
          PARTNERS_MCP_SHARED_SECRET: ${{ secrets.PARTNERS_MCP_SHARED_SECRET }}
          ZEPTOMAIL_WEBHOOK_SECRET: ${{ secrets.ZEPTOMAIL_WEBHOOK_SECRET }}
          AXIONIA_RELECTURE_SECRET: ${{ secrets.AXIONIA_RELECTURE_SECRET }}
          # SEC-63 : la cle de pseudonymisation des porteurs, hors rotation ; absente, le
          # provisionnement echoue en la nommant, avant que le serveur ne l exige.
          APPORTEUR_REF_KEY: ${{ secrets.APPORTEUR_REF_KEY }}
          # INT-T57 : secret conditionnel, exige au demarrage seulement si l envoi reel est allume.
          ZEPTOMAIL_SEND_TOKEN: ${{ secrets.ZEPTOMAIL_SEND_TOKEN }}
          # INT-T54 : le canal d alerte du serveur, jamais exige au demarrage.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          PARTNERS_EMAIL_DMARC_VERIFIE: ${{ vars.PARTNERS_EMAIL_DMARC_VERIFIE }}
          PARTNERS_EMAIL_EXPEDITEUR: ${{ vars.PARTNERS_EMAIL_EXPEDITEUR }}
          AXIONIA_BASE_URL: ${{ vars.AXIONIA_BASE_URL }}
          AXIONIA_API_ALLOWLIST: ${{ vars.AXIONIA_API_ALLOWLIST }}
          ZEPTOMAIL_API_URL: ${{ vars.ZEPTOMAIL_API_URL }}
        run: pnpm coolify:provisionner
